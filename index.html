<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>SENHS Gate Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
      margin: 0;
      background: #f4f7f5;
      color: #222;
    }

    h2 {
      margin-bottom: 18px;
    }

    .key-container {
      position: relative;
      width: 90%;
      max-width: 400px;
      margin: auto;
    }

    #deviceKey {
      width: 100%;
      padding: 14px 50px 14px 14px;
      font-size: 18px;
      border: 1px solid #aaa;
      border-radius: 8px;
      outline: none;
    }

    #toggleKey {
      position: absolute;
      right: 5px;
      top: 5px;
      height: 42px;
      width: 45px;
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }

    #startBtn {
      padding: 14px 22px;
      font-size: 18px;
      margin: 12px 0 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #176b3a;
      color: white;
    }

    #startBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }

    #status {
      margin: 20px auto;
      padding: 18px;
      max-width: 450px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      line-height: 1.4;
    }

    .ready {
      background: #eeeeee;
      color: #222;
    }

    .processing {
      background: #fff3cd;
      color: #664d03;
    }

    .accepted {
      background: #d4edda;
      color: #155724;
    }

    .denied {
      background: #f8d7da;
      color: #721c24;
    }

    .cooldown {
      font-size: 17px;
      margin-top: 8px;
    }

  </style>

</head>

<body>

<h2>SENHS GATE SCANNER</h2>

<div class="key-container">

  <input
    id="deviceKey"
    type="password"
    placeholder="Enter Gate Device Key"
    autocomplete="off"
  >

  <button
    id="toggleKey"
    type="button"
    aria-label="Show device key"
  >👁️</button>

</div>

<button id="startBtn" type="button">
  START SCANNER
</button>

<div id="status" class="ready">
  Enter authorized device key.
</div>

<div id="reader"></div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


let processing = false;
let scanner = null;
let scannerStarted = false;
let callbackCounter = 0;


const statusBox =
  document.getElementById("status");

const deviceKey =
  document.getElementById("deviceKey");

const toggleKey =
  document.getElementById("toggleKey");

const startBtn =
  document.getElementById("startBtn");


// =====================================
// SHOW / HIDE DEVICE KEY
// =====================================

toggleKey.addEventListener(
  "click",
  function () {

    if (deviceKey.type === "password") {

      deviceKey.type = "text";

      toggleKey.innerText = "🙈";

    } else {

      deviceKey.type = "password";

      toggleKey.innerText = "👁️";

    }

  }
);


// =====================================
// STATUS
// =====================================

function setStatus(message, className) {

  statusBox.innerHTML = message;

  statusBox.className = className;

}


// =====================================
// SOUND
// =====================================

function acceptedSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 880;

    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.35
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.35
    );

  } catch (error) {}

}


// =====================================
// FEEDBACK
// =====================================

function deviceFeedback() {

  acceptedSound();

  if (navigator.vibrate) {

    navigator.vibrate([
      150,
      80,
      150
    ]);

  }

}


// =====================================
// JSONP REQUEST
// =====================================

function jsonpRequest(url) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "senhsCallback_" +
        Date.now() +
        "_" +
        (++callbackCounter);

      const script =
        document.createElement("script");

      let finished = false;

      const timeout =
        setTimeout(
          function() {

            if (finished) return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "Server connection timeout."
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timeout);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }

      }


      window[callbackName] =
        function(data) {

          if (finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "Unable to connect to server."
            )
          );

        };


      script.src =
        url +
        "&callback=" +
        encodeURIComponent(callbackName);


      document.body.appendChild(script);

    }
  );

}


// =====================================
// START SCANNER
// =====================================

startBtn.addEventListener(
  "click",
  function() {

    const key =
      deviceKey.value.trim();


    if (!key) {

      setStatus(
        "❌ ENTER AUTHORIZED DEVICE KEY FIRST",
        "denied"
      );

      return;
    }


    if (scannerStarted) {

      setStatus(
        "SCANNER IS ALREADY RUNNING",
        "processing"
      );

      return;
    }


    scannerStarted = true;

    startBtn.disabled = true;

    setStatus(
      "STARTING CAMERA...<br>" +
      "Please allow camera access.",
      "processing"
    );


    scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }
);


// =====================================
// QR SCAN
// =====================================

function onScanSuccess(decodedText) {

  if (processing) return;

  processing = true;


  setStatus(
    "⏳ PROCESSING...<br>" +
    "Please wait.",
    "processing"
  );


  let lrn = "";


  // ===================================
  // GET LRN FROM QR
  // ===================================

  try {

    const url =
      new URL(decodedText);

    lrn =
      url.searchParams.get("lrn") || "";

  } catch (error) {

    // Allow plain LRN QR

    const plain =
      String(decodedText).trim();

    if (/^\d{8,15}$/.test(plain)) {

      lrn = plain;

    }

  }


  if (!lrn) {

    setStatus(
      "❌ INVALID QR CODE",
      "denied"
    );

    processing = false;

    return;
  }


  const key =
    deviceKey.value.trim();


  if (!key) {

    setStatus(
      "❌ DEVICE KEY REQUIRED",
      "denied"
    );

    processing = false;

    return;
  }


  // ===================================
  // BUILD REQUEST
  // ===================================

  const requestUrl =
    APPS_SCRIPT_URL +
    "?lrn=" +
    encodeURIComponent(lrn) +
    "&device=" +
    encodeURIComponent(key);


  // ===================================
  // JSONP REQUEST
  // ===================================

  jsonpRequest(requestUrl)

    .then(
      function(result) {

        if (!result) {

          throw new Error(
            "Empty server response."
          );

        }


        // ==============================
        // UNAUTHORIZED
        // ==============================

        if (
          result.authorized === false &&
          result.success === false
        ) {

          setStatus(
            "❌ ACCESS DENIED<br>" +
            "<span class='cooldown'>" +
            (result.message ||
             "Unauthorized device.") +
            "</span>",
            "denied"
          );

          startCooldown();

          return;

        }


        // ==============================
        // SERVER ERROR
        // ==============================

        if (result.success === false) {

          setStatus(
            "❌ ERROR<br>" +
            "<span class='cooldown'>" +
            (result.message ||
             "Unable to process scan.") +
            "</span>",
            "denied"
          );

          startCooldown();

          return;

        }


        // ==============================
        // SUCCESS
        // ==============================

        deviceFeedback();


        const event =
          result.event ||
          result.status ||
          "SCAN ACCEPTED";


        const name =
          result.name ||
          "";


        const section =
          result.section ||
          "";


        const transaction =
          result.transaction
            ? "Transaction #" +
              result.transaction
            : "";


        const time =
          result.timestamp ||
          result.time ||
          "";


        const sms =
          result.sms
            ? "<br>SMS: " + result.sms
            : "";


        setStatus(
          "✅ " +
          event +
          "<br><br>" +

          name +

          (section
            ? "<br>" + section
            : "") +

          (transaction
            ? "<br>" + transaction
            : "") +

          (time
            ? "<br>" + time
            : "") +

          sms +

          "<br><br>" +

          "<span class='cooldown'>" +
          "NEXT SCAN IN 5 SECONDS" +
          "</span>",

          "accepted"
        );


        startCooldown();

      }
    )

    .catch(
      function(error) {

        setStatus(
          "❌ CONNECTION ERROR<br>" +
          "<span class='cooldown'>" +
          "Unable to connect to server." +
          "</span>",
          "denied"
        );


        setTimeout(
          function() {

            processing = false;

            setStatus(
              "READY — I-SCAN ANG QR CODE",
              "ready"
            );

          },
          5000
        );

      }
    );

}


// =====================================
// COOLDOWN
// =====================================

function startCooldown() {

  let seconds = 5;


  const countdown =
    setInterval(
      function() {

        seconds--;


        if (seconds > 0) {

          statusBox.innerHTML =
            statusBox.innerHTML
              .replace(
                /NEXT SCAN IN \d+ SECONDS/,
                "NEXT SCAN IN " +
                seconds +
                " SECONDS"
              );

        } else {

          clearInterval(countdown);

          processing = false;

          setStatus(
            "READY — I-SCAN ANG QR CODE",
            "ready"
          );

        }

      },
      1000
    );

}


// =====================================
// QR SCANNER FAILURE
// =====================================

function onScanFailure(error) {

  // Normal habang naghahanap ng QR.

}

</script>

</body>
</html>
