!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENHS Gate Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>SENHS GATE SCANNER</h2>

  <div id="reader"></div>

  <div id="status">I-scan ang QR Code</div>

  <script>
    let processing = false;

    function onScanSuccess(decodedText) {

      if (processing) return;

      processing = true;

      document.getElementById("status").innerText =
        "Processing...";

      let lrn = "";

      try {
        const url = new URL(decodedText);
        lrn = url.searchParams.get("lrn");
      } catch (e) {
        document.getElementById("status").innerText =
          "Invalid QR Code";
        processing = false;
        return;
      }

      if (!lrn) {
        document.getElementById("status").innerText =
          "LRN not found";
        processing = false;
        return;
      }

      google.script.run
        .withSuccessHandler(function(result) {

          if (result.success) {

            document.getElementById("status").innerHTML =
              result.event + "<br>" +
              result.name + "<br>" +
              result.section + "<br>" +
              result.time;

          } else {

            document.getElementById("status").innerText =
              "ERROR: " + result.message;
          }

          setTimeout(function() {
            processing = false;
            document.getElementById("status").innerText =
              "I-scan ang QR Code";
          }, 3000);

        })
        .withFailureHandler(function(error) {

          document.getElementById("status").innerText =
            "System Error";

          processing = false;

        })
        .recordScan(lrn);
    }

    function onScanFailure(error) {
      // Normal lang habang naghahanap ng QR.
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);
  </script>

</body>
</html>
