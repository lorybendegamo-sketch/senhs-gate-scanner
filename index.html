<script>

  /* =====================================================
     API
     ===================================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfcybyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


  /* =====================================================
     VARIABLES
     ===================================================== */

  let authorizedDevice = "";

  let scanner = null;

  let scannerRunning = false;

  let scanLocked = false;

  let lockTimer = null;

  let countsTimer = null;

  let audioUnlocked = false;


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const loginPage =
    document.getElementById("loginPage");

  const scannerPage =
    document.getElementById("scannerPage");

  const deviceInput =
    document.getElementById("deviceInput");

  const startButton =
    document.getElementById("startButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const showPassword =
    document.getElementById("showPassword");

  const scannerStatus =
    document.getElementById("scannerStatus");

  const processingOverlay =
    document.getElementById("processingOverlay");

  const processingText =
    document.getElementById("processingText");

  const resultOverlay =
    document.getElementById("resultOverlay");

  const studentName =
    document.getElementById("studentName");

  const studentSection =
    document.getElementById("studentSection");

  const eventText =
    document.getElementById("eventText");

  const timeText =
    document.getElementById("timeText");


  /* =====================================================
     JSONP REQUEST
     This replaces fetch()
     ===================================================== */

  function jsonpRequest(
    url,
    timeoutMs = 15000
  ) {

    return new Promise(
      function(resolve, reject) {

        const callbackName =
          "_senhs_jsonp" +
          Date.now() +
          "_" +
          Math.floor(
            Math.random() * 100000
          );

        let finished = false;

        const script =
          document.createElement("script");

        const timer =
          setTimeout(
            function() {

              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Server connection timeout."
                )
              );

            },
            timeoutMs
          );


        function cleanup() {

          clearTimeout(timer);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] =
              undefined;
          }

          if (script.parentNode) {

            script.parentNode.removeChild(
              script
            );
          }
        }


        window[callbackName] =
          function(data) {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            resolve(data);
          };


        script.onerror =
          function() {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                "Unable to connect to server."
              )
            );
          };


        const separator =
          url.includes("?")
            ? "&"
            : "?";


        script.src =
          url +
          separator +
          "callback=" +
          encodeURIComponent(
            callbackName
          ) +
          "&_=" +
          Date.now();


        document.head.appendChild(
          script
        );

      }
    );

  }


  /* =====================================================
     SHOW / HIDE DEVICE CODE
     ===================================================== */

  showPassword.addEventListener(
    "click",
    function() {

      if (
        deviceInput.type ===
        "password"
      ) {

        deviceInput.type =
          "text";

        showPassword.textContent =
          "🙈";

      } else {

        deviceInput.type =
          "password";

        showPassword.textContent =
          "👁";
      }

    }
  );


  /* =====================================================
     VOICE
     ===================================================== */

  function speak(text) {

    try {

      if (
        !("speechSynthesis" in window)
      ) {

        return;
      }

      window.speechSynthesis.cancel();

      const message =
        new SpeechSynthesisUtterance(
          String(text)
        );

      message.rate =
        1.15;

      message.pitch =
        1.0;

      message.volume =
        1.0;

      message.lang =
        "en-US";

      window.speechSynthesis.speak(
        message
      );

    } catch (error) {

      console.log(
        "Voice not available.",
        error
      );
    }

  }


  /* =====================================================
     UNLOCK AUDIO
     ===================================================== */

  function unlockAudio() {

    try {

      if (
        "speechSynthesis"
        in window
      ) {

        window.speechSynthesis.cancel();

        const unlockMessage =
          new SpeechSynthesisUtterance("");

        unlockMessage.volume =
          0;

        window.speechSynthesis.speak(
          unlockMessage
        );

        audioUnlocked =
          true;
      }

    } catch (error) {

      console.log(
        "Audio unlock failed.",
        error
      );
    }


    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (AudioContext) {

        const context =
          new AudioContext();

        if (
          context.state ===
          "suspended"
        ) {

          context.resume();
        }

        const oscillator =
          context.createOscillator();

        const gain =
          context.createGain();

        gain.gain.value =
          0.0001;

        oscillator.connect(
          gain
        );

        gain.connect(
          context.destination
        );

        oscillator.start();

        oscillator.stop(
          context.currentTime +
          0.01
        );
      }

    } catch (error) {

      console.log(
        "Web audio unlock failed.",
        error
      );
    }

  }


  /* =====================================================
     BEEP
     ===================================================== */

  function playBeep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) {
        return;
      }

      const context =
        new AudioContext();

      if (
        context.state ===
        "suspended"
      ) {

        context.resume();
      }

      const oscillator =
        context.createOscillator();

      const gain =
        context.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.value =
        880;

      gain.gain.value =
        0.15;

      oscillator.connect(
        gain
      );

      gain.connect(
        context.destination
      );

      oscillator.start();

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        context.currentTime +
        0.18
      );

      oscillator.stop(
        context.currentTime +
        0.18
      );

    } catch (error) {

      console.log(
        "Beep unavailable."
      );
    }

  }


  /* =====================================================
     VIBRATION
     ===================================================== */

  function vibrateDevice() {

    try {

      if (
        "vibrate" in navigator
      ) {

        navigator.vibrate(
          [100, 60, 100]
        );
      }

    } catch (error) {

      console.log(
        "Vibration unavailable."
      );
    }

  }


  /* =====================================================
     START LOGIN
     ===================================================== */

  startButton.addEventListener(
    "click",
    async function() {

      unlockAudio();

      const key =
        deviceInput.value.trim();


      if (!key) {

        loginMessage.textContent =
          "Please enter the device code.";

        speak(
          "Please enter the device code."
        );

        return;
      }


      startButton.disabled =
        true;

      loginMessage.textContent =
        "Checking device...";


      try {

        const requestUrl =
          API_URL +
          "?device=" +
          encodeURIComponent(key) +
          "&format=json";


        console.log(
          "DEVICE SENT:",
          key
        );


        console.log(
          "JSONP REQUEST:",
          requestUrl
        );


        const result =
          await jsonpRequest(
            requestUrl
          );


        console.log(
          "SERVER RESULT:",
          result
        );


        if (
          !result ||
          result.authorized !== true
        ) {

          loginMessage.textContent =
            "Device was not authorized.";

          speak(
            "Device was not authorized."
          );

          startButton.disabled =
            false;

          return;
        }


        /* =========================
           AUTHORIZED
           ========================= */

        authorizedDevice =
          key;

        loginMessage.textContent =
          "";


        loginPage.style.display =
          "none";

        scannerPage.style.display =
          "block";


        document.getElementById(
          "deviceIndicator"
        ).textContent =
          "DEVICE AUTHORIZED";


        scannerStatus.textContent =
          "READY TO SCAN";


        speak(
          "Scanner ready."
        );


        await startScanner();


        loadAttendanceCounts();


        countsTimer =
          setInterval(
            loadAttendanceCounts,
            10000
          );


      } catch (error) {

        console.error(
          "DEVICE LOGIN ERROR:",
          error
        );


        loginMessage.textContent =
          "Connection error: " +
          error.message;


        speak(
          "Connection error."
        );


        startButton.disabled =
          false;
      }

    }
  );


  /* =====================================================
     START QR SCANNER
     ===================================================== */

  async function startScanner() {

    if (
      scannerRunning
    ) {

      return;
    }


    try {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 15,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          let size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.78
            );


          if (size < 240) {
            size = 240;
          }


          if (size > 450) {
            size = 450;
          }


          return {
            width: size,
            height: size
          };
        },

        aspectRatio: 1.0,

        rememberLastUsedCamera:
          true,

        showTorchButtonIfSupported:
          true
      };


      await scanner.start(

        {
          facingMode:
            "environment"
        },

        config,

        onScanSuccess,

        onScanError
      );


      scannerRunning =
        true;


      scannerStatus.textContent =
        "READY TO SCAN";


    } catch (error) {

      console.error(
        error
      );


      scannerStatus.textContent =
        "CAMERA ERROR";


      speak(
        "Camera error. Please check camera permission."
      );
    }

  }


  /* =====================================================
     SCAN ERROR
     ===================================================== */

  function onScanError(
    errorMessage
  ) {

    /*
     * Normal QR scanning generates
     * temporary errors.
     *
     * Do nothing.
     */

  }


  /* =====================================================
     QR SUCCESS
     ===================================================== */

  async function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    if (
      scanLocked
    ) {

      return;
    }


    scanLocked =
      true;


    clearTimeout(
      lockTimer
    );


    playBeep();

    vibrateDevice();


    scannerStatus.textContent =
      "PROCESSING...";


    processingText.textContent =
      "PROCESSING...";


    processingOverlay.style.display =
      "flex";


    speak(
      "Processing."
    );


    const lrn =
      extractLRN(
        decodedText
      );


    if (!lrn) {

      processingOverlay.style.display =
        "none";


      scannerStatus.textContent =
        "INVALID QR";


      speak(
        "Invalid QR."
      );


      unlockScannerAfterDelay();

      return;
    }


    try {

      const url =
        API_URL +
        "?lrn=" +
        encodeURIComponent(lrn) +
        "&device=" +
        encodeURIComponent(
          authorizedDevice
        ) +
        "&format=json";


      console.log(
        "SCAN REQUEST:",
        url
      );


      const result =
        await jsonpRequest(
          url,
          20000
        );


      console.log(
        "SCAN RESULT:",
        result
      );


      processingOverlay.style.display =
        "none";


      if (
        !result ||
        result.success !== true
      ) {

        const errorMessage =
          result &&
          result.message
            ? result.message
            : "Unable to record scan.";


        scannerStatus.textContent =
          errorMessage;


        speak(
          errorMessage
        );


        unlockScannerAfterDelay();

        return;
      }


      showStudentResult(
        result
      );


      loadAttendanceCounts();


    } catch (error) {

      console.error(
        "SCAN ERROR:",
        error
      );


      processingOverlay.style.display =
        "none";


      scannerStatus.textContent =
        "CONNECTION ERROR";


      speak(
        "Connection error. Please scan again."
      );


      unlockScannerAfterDelay();
    }

  }


  /* =====================================================
     EXTRACT LRN
     ===================================================== */

  function extractLRN(
    decodedText
  ) {

    try {

      const text =
        String(
          decodedText
        ).trim();


      if (
        text.includes(
          "script.google.com"
        )
      ) {

        const url =
          new URL(
            text
          );


        const lrn =
          url.searchParams.get(
            "lrn"
          );


        if (lrn) {

          return String(
            lrn
          ).trim();
        }
      }


      if (
        /^[0-9]{6,20}$/.test(
          text
        )
      ) {

        return text;
      }


      const match =
        text.match(
          /[?&]lrn=([^&#\s]+)/i
        );


      if (
        match &&
        match[1]
      ) {

        return decodeURIComponent(
          match[1]
        ).trim();
      }


      return "";

    } catch (error) {

      console.error(
        "LRN extraction error:",
        error
      );


      return "";
    }

  }


  /* =====================================================
     SHOW STUDENT RESULT
     ===================================================== */

  function showStudentResult(
    result
  ) {

    const name =
      result.name ||
      result.studentName ||
      "Student";


    const section =
      result.section ||
      result.studentSection ||
      "";


    const event =
      String(
        result.event ||
        ""
      ).toUpperCase();


    let displayTime =
      result.time ||
      result.timestamp ||
      "";


    if (!displayTime) {

      displayTime =
        new Date().toLocaleTimeString(
          "en-US",
          {
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit"
          }
        );
    }


    studentName.textContent =
      name;


    studentSection.textContent =
      section;


    eventText.textContent =
      event ||
      "RECORDED";


    timeText.textContent =
      displayTime;


    const status =
      String(
        result.status ||
        ""
      ).toUpperCase();


    if (
      status === "LATE"
    ) {

      eventText.textContent =
        "LATE";


      eventText.style.color =
        "#ca8a04";


      if (
        event === "TIME OUT"
      ) {

        speak(
          "Late. Time out recorded."
        );

      } else {

        speak(
          "Late. Time in recorded."
        );
      }


    } else {

      eventText.style.color =
        "#16a34a";


      if (
        event === "TIME IN"
      ) {

        speak(
          "Time in recorded."
        );

      } else if (
        event === "TIME OUT"
      ) {

        speak(
          "Time out recorded."
        );

      } else {

        speak(
          "Recorded."
        );
      }
    }


    resultOverlay.style.display =
      "flex";


    scannerStatus.textContent =
      event ||
      "RECORDED";


    setTimeout(
      function() {

        resultOverlay.style.display =
          "none";

      },
      5000
    );


    unlockScannerAfterDelay();

  }


  /* =====================================================
     UNLOCK SCANNER
     ===================================================== */

  function unlockScannerAfterDelay() {

    clearTimeout(
      lockTimer
    );


    lockTimer =
      setTimeout(
        function() {

          scanLocked =
            false;


          scannerStatus.textContent =
            "READY TO SCAN";

        },
        5000
      );

  }


  /* =====================================================
     LOAD ATTENDANCE COUNTS
     ===================================================== */

  async function loadAttendanceCounts() {

    try {

      const result =
        await jsonpRequest(
          API_URL +
          "?counts=1",
          20000
        );


      console.log(
        "ATTENDANCE RESULT:",
        result
      );


      if (
        !result ||
        result.success !== true
      ) {

        return;
      }


      updateAttendanceDashboard(
        result
      );


    } catch (error) {

      console.log(
        "Attendance counts unavailable.",
        error
      );
    }

  }


  /* =====================================================
     UPDATE ATTENDANCE DASHBOARD
     ===================================================== */

  function updateAttendanceDashboard(
    result
  ) {

    const school =
      result.school ||
      {};


    document.getElementById(
      "schoolMorningPresent"
    ).textContent =
      school.morningPresent ??
      0;


    document.getElementById(
      "schoolMorningLate"
    ).textContent =
      school.morningLate ??
      0;


    document.getElementById(
      "schoolMorningAbsent"
    ).textContent =
      school.morningAbsent ??
      0;


    document.getElementById(
      "schoolAfternoonPresent"
    ).textContent =
      school.afternoonPresent ??
      0;


    document.getElementById(
      "schoolAfternoonLate"
    ).textContent =
      school.afternoonLate ??
      0;


    document.getElementById(
      "schoolAfternoonAbsent"
    ).textContent =
      school.afternoonAbsent ??
      0;


    const sections =
      Array.isArray(
        result.sections
      )
        ? result.sections
        : [];


    const tbody =
      document.getElementById(
        "sectionTableBody"
      );


    tbody.innerHTML =
      "";


    if (
      sections.length === 0
    ) {

      const row =
        document.createElement(
          "tr"
        );


      const cell =
        document.createElement(
          "td"
        );


      cell.colSpan =
        7;


      cell.textContent =
        "No section data available.";


      row.appendChild(
        cell
      );


      tbody.appendChild(
        row
      );


      return;
    }


    sections.forEach(
      function(section) {

        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>
            ${escapeHTML(
              section.section || ""
            )}
          </td>

          <td class="present">
            ${Number(
              section.morningPresent || 0
            )}
          </td>

          <td class="late">
            ${Number(
              section.morningLate || 0
            )}
          </td>

          <td class="absent">
            ${Number(
              section.morningAbsent || 0
            )}
          </td>

          <td class="present">
            ${Number(
              section.afternoonPresent || 0
            )}
          </td>

          <td class="late">
            ${Number(
              section.afternoonLate || 0
            )}
          </td>

          <td class="absent">
            ${Number(
              section.afternoonAbsent || 0
            )}
          </td>

        `;


        tbody.appendChild(
          row
        );

      }
    );

  }


  /* =====================================================
     ESCAPE HTML
     ===================================================== */

  function escapeHTML(
    value
  ) {

    return String(
      value
    )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async function() {

        try {

          if (
            countsTimer
          ) {

            clearInterval(
              countsTimer
            );

            countsTimer =
              null;
          }


          if (
            scanner &&
            scannerRunning
          ) {

            await scanner.stop();

            scannerRunning =
              false;
          }

        } catch (error) {

          console.log(
            "Scanner stop error.",
            error
          );
        }


        authorizedDevice =
          "";


        scanner =
          null;


        scannerPage.style.display =
          "none";


        loginPage.style.display =
          "flex";


        deviceInput.value =
          "";


        loginMessage.textContent =
          "";


        scannerStatus.textContent =
          "READY TO SCAN";


        speak(
          "Scanner stopped."
        );

      }
    );


  /* =====================================================
     ENTER KEY
     ===================================================== */

  deviceInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        startButton.click();
      }

    }
  );


  /* =====================================================
     PAGE VISIBILITY
     ===================================================== */

  document.addEventListener(
    "visibilitychange",
    function() {

      if (
        document.visibilityState ===
        "visible" &&
        authorizedDevice
      ) {

        loadAttendanceCounts();
      }

    }
  );

  try {

    if (
      !("speechSynthesis" in window)
    ) {
      return;
    }

    window.speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(
        String(text)
      );

    message.rate = 1.15;
    message.pitch = 1.0;
    message.volume = 1.0;
    message.lang = "en-US";

    window.speechSynthesis.speak(
      message
    );

  } catch (error) {

    console.log(
      "Voice not available.",
      error
    );

  }

}


/* =====================================================
   UNLOCK AUDIO
   ===================================================== */

function unlockAudio() {

  try {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

      const unlockMessage =
        new SpeechSynthesisUtterance("");

      unlockMessage.volume = 0;

      window.speechSynthesis.speak(
        unlockMessage
      );

      audioUnlocked = true;

    }

  } catch (error) {

    console.log(
      "Audio unlock failed.",
      error
    );

  }


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {

      const context =
        new AudioContext();

      if (
        context.state ===
        "suspended"
      ) {

        context.resume();

      }

      const oscillator =
        context.createOscillator();

      const gain =
        context.createGain();

      gain.gain.value = 0.0001;

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start();

      oscillator.stop(
        context.currentTime + 0.01
      );

    }

  } catch (error) {

    console.log(
      "Web audio unlock failed.",
      error
    );

  }

}


/* =====================================================
   BEEP
   ===================================================== */

function playBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const context =
      new AudioContext();

    if (
      context.state ===
      "suspended"
    ) {

      context.resume();

    }

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;
    gain.gain.value = 0.15;

    oscillator.connect(gain);
    gain.connect(context.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      context.currentTime + 0.18
    );

    oscillator.stop(
      context.currentTime + 0.18
    );

  } catch (error) {

    console.log(
      "Beep unavailable."
    );

  }

}


/* =====================================================
   VIBRATION
   ===================================================== */

function vibrateDevice() {

  try {

    if (
      "vibrate" in navigator
    ) {

      navigator.vibrate(
        [100, 60, 100]
      );

    }

  } catch (error) {

    console.log(
      "Vibration unavailable."
    );

  }

}


/* =====================================================
   DEVICE LOGIN
   ===================================================== */

startButton.addEventListener(
  "click",
  async function() {

    unlockAudio();

    const key =
      deviceInput.value.trim();

    if (!key) {

      loginMessage.textContent =
        "Please enter the device code.";

      speak(
        "Please enter the device code."
      );

      return;

    }

    startButton.disabled = true;

    loginMessage.textContent =
      "Checking device...";


    try {

      const requestUrl =
        API_URL +
        "?device=" +
        encodeURIComponent(key) +
        "&format=json";


      console.log(
        "DEVICE LOGIN:",
        requestUrl
      );


      const result =
        await jsonpRequest(
          requestUrl,
          20000
        );


      console.log(
        "SERVER RESULT:",
        result
      );


      if (
        !result ||
        result.authorized !== true
      ) {

        loginMessage.textContent =
          "Device was not authorized.";

        speak(
          "Device was not authorized."
        );

        startButton.disabled =
          false;

        return;

      }


      authorizedDevice =
        key;


      loginMessage.textContent =
        "";


      loginPage.style.display =
        "none";

      scannerPage.style.display =
        "block";


      document.getElementById(
        "deviceIndicator"
      ).textContent =
        "DEVICE AUTHORIZED";


      scannerStatus.textContent =
        "READY TO SCAN";


      speak(
        "Scanner ready."
      );


      await startScanner();


      loadAttendanceCounts();


      if (countsTimer) {

        clearInterval(
          countsTimer
        );

      }


      countsTimer =
        setInterval(
          loadAttendanceCounts,
          10000
        );


    } catch (error) {

      console.error(
        "DEVICE LOGIN ERROR:",
        error
      );


      loginMessage.textContent =
        "Connection error: " +
        error.message;


      speak(
        "Connection error."
      );


      startButton.disabled =
        false;

    }

  }
);


/* =====================================================
   START QR SCANNER
   ===================================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 15,

      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          let size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.78
            );


          if (size < 240) {
            size = 240;
          }

          if (size > 450) {
            size = 450;
          }


          return {
            width: size,
            height: size
          };

        },

      aspectRatio: 1.0,

      rememberLastUsedCamera:
        true,

      showTorchButtonIfSupported:
        true

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanError

    );


    scannerRunning = true;

    scannerStatus.textContent =
      "READY TO SCAN";


  } catch (error) {

    console.error(error);

    scannerStatus.textContent =
      "CAMERA ERROR";

    speak(
      "Camera error. Please check camera permission."
    );

  }

}


/* =====================================================
   SCAN ERROR
   ===================================================== */

function onScanError(errorMessage) {

  // Normal QR scanning produces temporary errors.
  // Do nothing.

}


/* =====================================================
   QR SUCCESS
   ===================================================== */

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (scanLocked) {
    return;
  }


  scanLocked = true;


  clearTimeout(lockTimer);


  playBeep();

  vibrateDevice();


  scannerStatus.textContent =
    "PROCESSING...";


  processingText.textContent =
    "PROCESSING...";


  processingOverlay.style.display =
    "flex";


  speak(
    "Processing."
  );


  const lrn =
    extractLRN(
      decodedText
    );


  if (!lrn) {

    processingOverlay.style.display =
      "none";

    scannerStatus.textContent =
      "INVALID QR";

    speak(
      "Invalid QR."
    );

    unlockScannerAfterDelay();

    return;

  }


  try {

    const url =
      API_URL +
      "?lrn=" +
      encodeURIComponent(lrn) +
      "&device=" +
      encodeURIComponent(
        authorizedDevice
      ) +
      "&format=json";


    console.log(
      "SCAN REQUEST:",
      url
    );


    const result =
      await jsonpRequest(
        url,
        25000
      );


    console.log(
      "SCAN RESULT:",
      result
    );


    processingOverlay.style.display =
      "none";


    if (
      !result ||
      result.success !== true
    ) {

      const errorMessage =
        result &&
        result.message
          ? result.message
          : "Unable to record scan.";


      scannerStatus.textContent =
        errorMessage;


      speak(
        errorMessage
      );


      unlockScannerAfterDelay();

      return;

    }


    showStudentResult(
      result
    );


    loadAttendanceCounts();


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    processingOverlay.style.display =
      "none";


    scannerStatus.textContent =
      "SCAN CONNECTION ERROR";


    speak(
      "Scan connection error."
    );


    unlockScannerAfterDelay();

  }

}


/* =====================================================
   EXTRACT LRN
   ===================================================== */

function extractLRN(
  decodedText
) {

  try {

    const text =
      String(
        decodedText
      ).trim();


    if (
      text.includes(
        "script.google.com"
      )
    ) {

      const url =
        new URL(text);


      const lrn =
        url.searchParams.get(
          "lrn"
        );


      if (lrn) {

        return String(
          lrn
        ).trim();

      }

    }


    if (
      /^[0-9]{6,20}$/.test(text)
    ) {

      return text;

    }


    const match =
      text.match(
        /[?&]lrn=([^&#\s]+)/i
      );


    if (
      match &&
      match[1]
    ) {

      return decodeURIComponent(
        match[1]
      ).trim();

    }


    return "";

  } catch (error) {

    console.error(
      "LRN extraction error:",
      error
    );

    return "";

  }

}


/* =====================================================
   SHOW RESULT
   ===================================================== */

function showStudentResult(
  result
) {

  const name =
    result.name ||
    result.studentName ||
    "Student";


  const section =
    result.section ||
    result.studentSection ||
    "";


  const event =
    String(
      result.event ||
      ""
    ).toUpperCase();


  let displayTime =
    result.time ||
    result.timestamp ||
    "";


  if (!displayTime) {

    displayTime =
      new Date().toLocaleTimeString(
        "en-US",
        {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        }
      );

  }


  studentName.textContent =
    name;


  studentSection.textContent =
    section;


  eventText.textContent =
    event ||
    "RECORDED";


  timeText.textContent =
    displayTime;


  const status =
    String(
      result.status ||
      ""
    ).toUpperCase();


  if (status === "LATE") {

    eventText.textContent =
      "LATE";

    eventText.style.color =
      "#ca8a04";


    if (event === "TIME OUT") {

      speak(
        "Late. Time out recorded."
      );

    } else {

      speak(
        "Late. Time in recorded."
      );

    }

  } else {

    eventText.style.color =
      "#16a34a";


    if (event === "TIME IN") {

      speak(
        "Time in recorded."
      );

    } else if (event === "TIME OUT") {

      speak(
        "Time out recorded."
      );

    } else {

      speak(
        "Recorded."
      );

    }

  }


  resultOverlay.style.display =
    "flex";


  scannerStatus.textContent =
    event ||
    "RECORDED";


  setTimeout(
    function() {

      resultOverlay.style.display =
        "none";

    },
    5000
  );


  unlockScannerAfterDelay();

}


/* =====================================================
   UNLOCK SCANNER
   ===================================================== */

function unlockScannerAfterDelay() {

  clearTimeout(
    lockTimer
  );


  lockTimer =
    setTimeout(
      function() {

        scanLocked = false;

        scannerStatus.textContent =
          "READY TO SCAN";

      },
      5000
    );

}


/* =====================================================
   ATTENDANCE COUNTS
   ===================================================== */

async function loadAttendanceCounts() {

  try {

    const result =
      await jsonpRequest(
        API_URL +
        "?counts=1",
        25000
      );


    console.log(
      "ATTENDANCE COUNTS:",
      result
    );


    if (
      !result ||
      result.success !== true
    ) {

      return;

    }


    updateAttendanceDashboard(
      result
    );


  } catch (error) {

    console.log(
      "Attendance counts unavailable.",
      error
    );

  }

}


/* =====================================================
   UPDATE DASHBOARD
   ===================================================== */

function updateAttendanceDashboard(
  result
) {

  const school =
    result.school ||
    {};


  document.getElementById(
    "schoolMorningPresent"
  ).textContent =
    school.morningPresent ?? 0;


  document.getElementById(
    "schoolMorningLate"
  ).textContent =
    school.morningLate ?? 0;


  document.getElementById(
    "schoolMorningAbsent"
  ).textContent =
    school.morningAbsent ?? 0;


  document.getElementById(
    "schoolAfternoonPresent"
  ).textContent =
    school.afternoonPresent ?? 0;


  document.getElementById(
    "schoolAfternoonLate"
  ).textContent =
    school.afternoonLate ?? 0;


  document.getElementById(
    "schoolAfternoonAbsent"
  ).textContent =
    school.afternoonAbsent ?? 0;


  const sections =
    Array.isArray(
      result.sections
    )
      ? result.sections
      : [];


  const tbody =
    document.getElementById(
      "sectionTableBody"
    );


  tbody.innerHTML = "";


  if (
    sections.length === 0
  ) {

    const row =
      document.createElement(
        "tr"
      );


    const cell =
      document.createElement(
        "td"
      );


    cell.colSpan = 7;

    cell.textContent =
      "No section data available.";


    row.appendChild(cell);

    tbody.appendChild(row);

    return;

  }


  sections.forEach(
    function(section) {

      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>
          ${escapeHTML(
            section.section || ""
          )}
        </td>

        <td class="present">
          ${Number(
            section.morningPresent || 0
          )}
        </td>

        <td class="late">
          ${Number(
            section.morningLate || 0
          )}
        </td>

        <td class="absent">
          ${Number(
            section.morningAbsent || 0
          )}
        </td>

        <td class="present">
          ${Number(
            section.afternoonPresent || 0
          )}
        </td>

        <td class="late">
          ${Number(
            section.afternoonLate || 0
          )}
        </td>

        <td class="absent">
          ${Number(
            section.afternoonAbsent || 0
          )}
        </td>

      `;


      tbody.appendChild(row);

    }
  );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   LOGOUT
   ===================================================== */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function() {

      try {

        if (countsTimer) {

          clearInterval(
            countsTimer
          );

          countsTimer = null;

        }


        if (
          scanner &&
          scannerRunning
        ) {

          await scanner.stop();

          scannerRunning = false;

        }

      } catch (error) {

        console.log(
          "Scanner stop error.",
          error
        );

      }


      authorizedDevice = "";

      scanner = null;


      scannerPage.style.display =
        "none";


      loginPage.style.display =
        "flex";


      deviceInput.value = "";

      loginMessage.textContent = "";

      scannerStatus.textContent =
        "READY TO SCAN";


      speak(
        "Scanner stopped."
      );

    }
  );


/* =====================================================
   ENTER KEY
   ===================================================== */

deviceInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      startButton.click();

    }

  }
);


/* =====================================================
   PAGE VISIBILITY
   ===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible" &&
      authorizedDevice
    ) {

      loadAttendanceCounts();

    }

  }
);

</script>
