<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>San Esteban National High School - Gate Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  background:
    radial-gradient(circle at 8% 12%, rgba(255,255,255,.75) 0 70px, transparent 71px),
    radial-gradient(circle at 92% 18%, rgba(255,255,255,.6) 0 90px, transparent 91px),
    linear-gradient(135deg, #d9f1ff 0%, #eefaf5 45%, #ccecff 100%);
}

body::before {
  content: "";
  position: fixed;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  right: -150px;
  top: 35%;
  background: rgba(19,105,145,.08);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  left: -130px;
  bottom: -100px;
  background: rgba(24,151,125,.09);
  z-index: -2;
}


/* =========================
   LOGIN PAGE
========================= */

#loginPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.loginCard {
  width: 100%;
  max-width: 550px;
  padding: 32px 28px;
  text-align: center;

  background: rgba(255,255,255,.94);
  border-radius: 28px;

  border: 2px solid rgba(18,97,138,.12);

  box-shadow:
    0 20px 60px rgba(18,63,99,.20);
}


/* LOGO PLACEHOLDER */

.schoolLogo {
  width: 105px;
  height: 105px;
  margin: 0 auto 15px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(145deg, #12618a, #199a8b);

  color: white;

  border: 6px solid rgba(255,255,255,.9);

  box-shadow:
    0 8px 25px rgba(18,97,138,.25);

  font-weight: 900;
  font-size: 14px;
  line-height: 1.05;
  text-align: center;
}

.schoolLogo span {
  display: block;
}


/* LOGIN TITLE */

#loginTitle {
  margin: 0 0 28px;
  line-height: 1.03;
}

#loginTitle span,
#loginTitle strong {
  display: block;
}

#loginTitle span {
  font-size: clamp(24px, 6vw, 38px);
  font-weight: 900;
  color: #123f63;
  letter-spacing: .8px;
}

#loginTitle strong {
  margin-top: 7px;
  font-size: clamp(32px, 8vw, 48px);
  color: #198b8c;
  letter-spacing: 1px;
}


/* INPUT */

.inputLabel {
  display: block;
  text-align: left;
  margin-bottom: 8px;

  font-size: 15px;
  font-weight: 800;
  color: #31566d;
}

.passwordBox {
  position: relative;
}

#deviceKey {
  width: 100%;
  height: 54px;

  padding: 0 55px 0 16px;

  border: 2px solid #b7d6e3;
  border-radius: 15px;

  font-size: 16px;
  outline: none;
}

#deviceKey:focus {
  border-color: #198b8c;
  box-shadow:
    0 0 0 4px rgba(25,139,140,.12);
}

#togglePassword {
  position: absolute;
  right: 5px;
  top: 6px;

  width: 42px;
  height: 42px;

  border: 0;
  background: transparent;

  border-radius: 10px;

  font-size: 20px;
  cursor: pointer;
}


/* START BUTTON */

#startButton {
  width: 100%;
  min-height: 55px;

  margin-top: 18px;

  border: 0;
  border-radius: 15px;

  background:
    linear-gradient(135deg, #12618a, #199a8b);

  color: white;

  font-size: 17px;
  font-weight: 900;

  letter-spacing: .5px;

  cursor: pointer;

  box-shadow:
    0 9px 22px rgba(18,97,138,.25);
}

#startButton:active {
  transform: scale(.98);
}

#loginMessage {
  min-height: 22px;
  margin-top: 15px;
  font-weight: 700;
}


/* =========================
   SCANNER PAGE
========================= */

#scannerPage {
  display: none;

  min-height: 100vh;

  padding:
    18px
    16px
    35px;
}

.scannerShell {
  position: relative;

  width: 100%;
  max-width: 1000px;

  margin: auto;

  padding:
    20px
    18px
    25px;

  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.84),
      rgba(235,250,247,.80)
    );

  border:
    2px solid rgba(255,255,255,.85);

  box-shadow:
    0 20px 60px rgba(18,63,99,.14);

  overflow: hidden;
}


/* SCHOOL DECORATIVE BACKGROUND */

.scannerShell::before {
  content: "";

  position: absolute;

  width: 180px;
  height: 180px;

  top: -90px;
  left: -90px;

  border-radius: 50%;

  background:
    rgba(18,97,138,.12);
}

.scannerShell::after {
  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  bottom: -120px;
  right: -100px;

  border-radius: 50%;

  background:
    rgba(25,154,139,.13);
}


/* SCHOOL LOGO */

.scannerLogo {
  position: relative;
  z-index: 2;

  width: 90px;
  height: 90px;

  margin: 0 auto 10px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(145deg, #12618a, #199a8b);

  color: white;

  border: 5px solid white;

  box-shadow:
    0 8px 25px rgba(18,97,138,.25);

  text-align: center;

  font-size: 12px;
  font-weight: 900;
  line-height: 1.05;
}


/* TITLE */

#scannerTitle {
  position: relative;
  z-index: 2;

  margin: 0 auto 13px;

  text-align: center;

  line-height: 1.03;

  color: #123f63;
}

#scannerTitle span,
#scannerTitle strong {
  display: block;
}

#scannerTitle span {
  font-size:
    clamp(24px, 5vw, 42px);

  font-weight: 900;

  letter-spacing: 1px;
}

#scannerTitle strong {
  margin-top: 5px;

  font-size:
    clamp(34px, 6vw, 52px);

  color: #198b8c;

  letter-spacing: 1px;
}


/* SCHOOL LINE */

.schoolLine {
  position: relative;
  z-index: 2;

  width: min(520px, 78%);

  height: 5px;

  margin:
    0 auto
    20px;

  border-radius: 20px;

  background:
    linear-gradient(
      90deg,
      #12618a,
      #199a8b,
      #12618a
    );
}


/* =========================
   CAMERA
========================= */

.cameraCard {
  position: relative;
  z-index: 2;

  width: 100%;

  margin: auto;

  padding: 11px;

  border-radius: 26px;

  background:
    linear-gradient(
      145deg,
      rgba(18,97,138,.20),
      rgba(25,154,139,.17)
    );

  border:
    3px solid rgba(18,97,138,.15);

  box-shadow:
    0 20px 45px rgba(18,63,99,.20);
}

.cameraInner {
  position: relative;

  width: 100%;

  overflow: hidden;

  border-radius: 18px;

  background: #07151d;
}

#reader {
  width: 100%;
}

#reader video {
  width: 100% !important;
  height: auto !important;

  display: block;

  object-fit: cover;
}


/* QR CONTROLS */

#reader__dashboard_section_csr button {
  border-radius: 10px !important;
  border: 0 !important;

  padding:
    10px 15px !important;

  font-weight: 700 !important;
}

#reader__dashboard_section_csr span {
  font-size: 14px !important;
}


/* =========================
   PROCESSING OVERLAY
========================= */

#processingOverlay {
  display: none;

  position: absolute;

  inset: 0;

  z-index: 40;

  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    rgba(5,31,47,.72);

  backdrop-filter:
    blur(3px);
}

.processingBox {
  width: 82%;
  max-width: 560px;

  padding:
    28px 18px;

  border-radius: 24px;

  background:
    linear-gradient(
      145deg,
      rgba(18,97,138,.98),
      rgba(25,154,139,.98)
    );

  border:
    3px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.45);

  color: white;
}

.processingIcon {
  width: 65px;
  height: 65px;

  margin:
    0 auto
    12px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    rgba(255,255,255,.18);

  border:
    2px solid
    rgba(255,255,255,.65);

  font-size: 32px;
}

#processingText {
  font-size:
    clamp(34px, 8vw, 58px);

  line-height: 1;

  font-weight: 900;

  letter-spacing: 2px;

  margin: 0;
}

.processingSubtext {
  margin-top: 12px;

  font-size:
    clamp(15px, 3vw, 21px);

  font-weight: 700;

  opacity: .95;
}


/* =========================
   STUDENT RESULT OVERLAY
========================= */

#resultOverlay {
  display: none;

  position: absolute;

  left: 14px;
  right: 14px;

  top: 50%;

  transform:
    translateY(-50%);

  z-index: 50;

  padding:
    24px 16px;

  border-radius: 22px;

  color: white;

  text-align: center;

  background:
    linear-gradient(
      145deg,
      rgba(15,83,128,.98),
      rgba(20,145,143,.98)
    );

  border:
    2px solid
    rgba(255,255,255,.78);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(7px);
}


/* CHECK */

.resultCheck {
  width: 58px;
  height: 58px;

  margin:
    0 auto
    10px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    rgba(255,255,255,.18);

  border:
    2px solid
    rgba(255,255,255,.65);

  font-size: 31px;

  font-weight: 900;
}


/* STUDENT NAME */

#studentName {
  font-size:
    clamp(24px, 5vw, 38px);

  line-height: 1.1;

  font-weight: 900;

  margin:
    5px 0
    8px;

  word-break: break-word;
}


/* SECTION */

#studentSection {
  font-size:
    clamp(17px, 3vw, 23px);

  font-weight: 700;

  margin-bottom: 15px;

  opacity: .95;
}


/* EVENT */

#eventText {
  font-size:
    clamp(28px, 6vw, 42px);

  font-weight: 900;

  letter-spacing: 1px;

  margin: 5px 0;
}


/* TIME */

#timeText {
  font-size:
    clamp(17px, 3vw, 23px);

  font-weight: 700;

  margin-top: 7px;
}


/* RECORDED */

.recorded {
  display: inline-block;

  margin-top: 14px;

  padding:
    8px 18px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.18);

  border:
    1px solid
    rgba(255,255,255,.55);

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   READY MESSAGE
========================= */

#readyMessage {
  position: relative;
  z-index: 2;

  text-align: center;

  margin-top: 16px;

  padding:
    13px 15px;

  border-radius: 16px;

  background:
    rgba(255,255,255,.86);

  border:
    1px solid
    rgba(18,97,138,.12);

  color: #12618a;

  font-size: 20px;

  font-weight: 900;

  letter-spacing: .8px;

  box-shadow:
    0 8px 20px
    rgba(18,63,99,.08);
}


/* =========================
   PHONE
========================= */

@media (max-width: 767px) {

  #scannerPage {
    padding:
      10px
      8px
      25px;
  }

  .scannerShell {
    padding:
      16px
      9px
      20px;

    border-radius: 24px;
  }

  .cameraCard {
    padding: 7px;
    border-radius: 20px;
  }

  .cameraInner {
    border-radius: 14px;
  }

  #resultOverlay {
    left: 8px;
    right: 8px;

    padding:
      18px 10px;

    border-radius: 18px;
  }

  .processingBox {
    width: 88%;
    padding:
      25px 12px;
  }

  .processingIcon {
    width: 55px;
    height: 55px;
    font-size: 27px;
  }

}


/* =========================
   LAPTOP
========================= */

@media (min-width: 768px) {

  #scannerPage {
    padding-top: 25px;
  }

  .cameraCard {
    max-width: 800px;
  }

  #reader {
    min-height: 500px;
  }

  #reader video {
    min-height: 500px;
    object-fit: cover;
  }

  #resultOverlay {
    max-width: 760px;
    margin: auto;
  }

}


/* =========================
   LARGE DESKTOP
========================= */

@media (min-width: 1100px) {

  .cameraCard {
    max-width: 900px;
  }

  #reader {
    min-height: 570px;
  }

  #reader video {
    min-height: 570px;
  }

}
</style>
</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginPage">

  <div class="loginCard">

    <div class="schoolLogo">
      <span>
        SENHS<br>
        SCHOOL<br>
        LOGO
      </span>
    </div>


    <h1 id="loginTitle">

      <span>
        SAN ESTEBAN NATIONAL HIGH SCHOOL
      </span>

      <strong>
        GATE SCANNER
      </strong>

    </h1>


    <label
      class="inputLabel"
      for="deviceKey">

      Enter Gate Device Code

    </label>


    <div class="passwordBox">

      <input
        id="deviceKey"
        type="password"
        autocomplete="off"
        placeholder="Enter authorized device code"
      >

      <button
        id="togglePassword"
        type="button"
        aria-label="Show or hide device code">

        👁️

      </button>

    </div>


    <button
      id="startButton"
      type="button">

      START SCANNER

    </button>


    <div id="loginMessage"></div>

  </div>

</section>



<!-- =========================
     SCANNER
========================= -->

<section id="scannerPage">

  <div class="scannerShell">


    <div class="scannerLogo">

      SENHS<br>
      SCHOOL<br>
      LOGO

    </div>


    <h1 id="scannerTitle">

      <span>
        SAN ESTEBAN NATIONAL HIGH SCHOOL
      </span>

      <strong>
        GATE SCANNER
      </strong>

    </h1>


    <div class="schoolLine"></div>


    <div class="cameraCard">

      <div class="cameraInner">

        <div id="reader"></div>


        <!-- =====================
             PROCESSING OVERLAY
        ====================== -->

        <div id="processingOverlay">

          <div class="processingBox">

            <div class="processingIcon">
              ⟳
            </div>

            <div id="processingText">
              PROCESSING...
            </div>

            <div class="processingSubtext">
              Please wait while the QR code is being recorded.
            </div>

          </div>

        </div>


        <!-- =====================
             STUDENT RESULT
        ====================== -->

        <div id="resultOverlay">

          <div class="resultCheck">
            ✓
          </div>


          <div id="studentName">
            Student Name
          </div>


          <div id="studentSection">
            Grade / Section
          </div>


          <div id="eventText">
            TIME IN
          </div>


          <div id="timeText">
            00:00:00 AM
          </div>


          <div class="recorded">
            RECORDED
          </div>

        </div>

      </div>

    </div>


    <div id="readyMessage">
      READY — SCAN QR CODE
    </div>


  </div>

</section>



<script>


/* =========================
   CONFIGURATION
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


let deviceKey = "";

let scanner = null;

let scanningLocked = false;



/* =========================
   ELEMENTS
========================= */

const loginPage =
  document.getElementById("loginPage");

const scannerPage =
  document.getElementById("scannerPage");

const deviceInput =
  document.getElementById("deviceKey");

const togglePassword =
  document.getElementById("togglePassword");

const startButton =
  document.getElementById("startButton");

const loginMessage =
  document.getElementById("loginMessage");

const processingOverlay =
  document.getElementById("processingOverlay");

const resultOverlay =
  document.getElementById("resultOverlay");

const studentName =
  document.getElementById("studentName");

const studentSection =
  document.getElementById("studentSection");

const eventText =
  document.getElementById("eventText");

const timeText =
  document.getElementById("timeText");

const readyMessage =
  document.getElementById("readyMessage");



/* =========================
   SHOW / HIDE PASSWORD
========================= */

togglePassword.addEventListener(
  "click",
  function() {

    if (
      deviceInput.type ===
      "password"
    ) {

      deviceInput.type =
        "text";

      togglePassword.textContent =
        "🙈";

    } else {

      deviceInput.type =
        "password";

      togglePassword.textContent =
        "👁️";

    }

  }
);



/* =========================
   ENTER KEY
========================= */

deviceInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      startButton.click();

    }

  }
);



/* =========================
   DEVICE AUTHENTICATION
========================= */

startButton.addEventListener(
  "click",
  async function() {

    const key =
      deviceInput.value.trim();


    if (!key) {

      loginMessage.textContent =
        "Please enter the device code.";

      loginMessage.style.color =
        "#b42318";

      return;
    }


    loginMessage.textContent =
      "Checking device...";

    loginMessage.style.color =
      "#12618a";


    try {

      const response =
        await fetch(

          API_URL +
          "?device=" +
          encodeURIComponent(key) +
          "&format=json",

          {
            method: "GET",
            cache: "no-store"
          }

        );


      const data =
        await response.json();


      if (!data.success) {

        loginMessage.textContent =
          "ACCESS DENIED — Unauthorized device.";

        loginMessage.style.color =
          "#b42318";

        return;
      }


      deviceKey =
        key;


      loginPage.style.display =
        "none";

      scannerPage.style.display =
        "block";


      startCamera();


    } catch (error) {

      loginMessage.textContent =
        "Unable to connect. Please check your internet.";

      loginMessage.style.color =
        "#b42318";

    }

  }
);



/* =========================
   START CAMERA
========================= */

function startCamera() {

  if (scanner) {
    return;
  }


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 15,


    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {


        let size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.78;


        if (
          window.innerWidth >= 768
        ) {

          size =
            Math.min(
              size,
              450
            );

        } else {

          size =
            Math.min(
              size,
              330
            );

        }


        size =
          Math.max(
            size,
            240
          );


        return {

          width: size,

          height: size

        };

      },


    aspectRatio:
      1.333334

  };


  scanner.start(

    {
      facingMode:
        "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  ).catch(
    function(error) {

      readyMessage.textContent =
        "CAMERA ERROR — PLEASE ALLOW CAMERA ACCESS";

      readyMessage.style.color =
        "#b42318";

      console.error(error);

    }
  );

}



/* =========================
   QR SCAN
========================= */

async function onScanSuccess(
  decodedText
) {


  /* DO NOT ACCEPT ANOTHER QR
     WHILE PROCESSING OR DISPLAYING */
  if (scanningLocked) {
    return;
  }


  scanningLocked = true;


  let lrn = "";


  try {

    const url =
      new URL(decodedText);

    lrn =
      url.searchParams.get(
        "lrn"
      ) || "";


  } catch (error) {

    lrn =
      String(
        decodedText
      ).trim();

  }


  if (!lrn) {

    scanningLocked = false;

    return;

  }


  /* =====================
     SHOW LARGE PROCESSING
     INSIDE CAMERA
  ====================== */

  processingOverlay.style.display =
    "flex";

  resultOverlay.style.display =
    "none";

  readyMessage.textContent =
    "PROCESSING...";

  readyMessage.style.color =
    "#12618a";


  try {


    const response =
      await fetch(

        API_URL +

        "?lrn=" +
        encodeURIComponent(lrn) +

        "&device=" +
        encodeURIComponent(deviceKey) +

        "&format=json",

        {
          method: "GET",
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    /* PROCESSING FINISHED */

    processingOverlay.style.display =
      "none";


    if (!data.success) {

      readyMessage.textContent =
        data.message ||
        "SCAN FAILED";

      readyMessage.style.color =
        "#b42318";

      setTimeout(
        function() {

          readyMessage.textContent =
            "READY — SCAN QR CODE";

          readyMessage.style.color =
            "#12618a";

          scanningLocked =
            false;

        },
        2000
      );

      return;

    }


    /* =====================
       DISPLAY STUDENT RESULT
    ====================== */

    studentName.textContent =
      data.name ||
      "Student";


    studentSection.textContent =
      data.section ||
      "";


    eventText.textContent =
      data.event ||
      "";


    timeText.textContent =
      data.time ||
      "";


    resultOverlay.style.display =
      "block";


    readyMessage.textContent =
      "SCAN RECORDED";

    readyMessage.style.color =
      "#16734a";


    /* SOUND */

    playBeep();


    /* VIBRATION */

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [150, 80, 150]
      );

    }


    /* =====================
       RESULT FOR 5 SECONDS
    ====================== */

    setTimeout(
      function() {

        resultOverlay.style.display =
          "none";


        readyMessage.textContent =
          "READY — SCAN QR CODE";


        readyMessage.style.color =
          "#12618a";


        scanningLocked =
          false;

      },
      5000
    );


  } catch (error) {


    /*
      Hide processing overlay
      after request finishes.
    */

    processingOverlay.style.display =
      "none";


    /*
      If browser cannot read
      the response, do not show
      a false "NO INTERNET".
    */

    readyMessage.textContent =
      "SCAN SENT — PLEASE WAIT...";


    readyMessage.style.color =
      "#12618a";


    setTimeout(
      function() {

        readyMessage.textContent =
          "READY — SCAN QR CODE";

        readyMessage.style.color =
          "#12618a";

        scanningLocked =
          false;

      },
      5000
    );

  }

}



/* =========================
   QR FAILURE
========================= */

function onScanFailure(error) {

  /*
    Normal QR detection failures
    are ignored automatically.
  */

}



/* =========================
   BEEP
========================= */

function playBeep() {


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      880;


    gain.gain.value =
      0.18;


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      180
    );


  } catch (error) {

    console.log(
      "Audio not available."
    );

  }

}

</script>
