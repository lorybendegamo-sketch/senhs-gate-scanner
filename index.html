<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>SENHS Gate Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #ffffff;
}

h2 {
  margin: 10px 0 20px;
}


/* =========================
   LOGIN
========================= */

#loginPage {
  max-width: 450px;
  margin: auto;
}

.keyBox {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

#deviceKey {
  width: 100%;
  padding: 15px 50px 15px 15px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

#showKey {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  font-size: 21px;
}

#startBtn {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 8px;
}


/* =========================
   STATUS
========================= */

.status {
  max-width: 450px;
  margin: 15px auto;
  padding: 15px;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
}

.ready {
  background: #eeeeee;
  color: #222;
}

.processing {
  background: #fff3cd;
  color: #664d03;
}

.accepted {
  background: #d4edda;
  color: #155724;
}

.denied {
  background: #f8d7da;
  color: #721c24;
}


/* =========================
   SCANNER PAGE
========================= */

#scannerPage {
  display: none;
}

#scannerTitle {
  font-size: 25px;
  font-weight: bold;
  margin: 10px 0 15px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: auto;
}

#countdown {
  margin-top: 12px;
  font-size: 18px;
  font-weight: bold;
}

</style>

</head>


<body>


<!-- =========================
     PAGE 1
========================= -->

<div id="loginPage">

  <h2>SENHS GATE SCANNER</h2>

  <div class="keyBox">

    <input
      id="deviceKey"
      type="password"
      placeholder="Enter Gate Device Key"
      autocomplete="off"
    >

    <button
      id="showKey"
      type="button"
    >
      👁️
    </button>

  </div>


  <button
    id="startBtn"
    type="button"
  >
    START SCANNER
  </button>


  <div
    id="loginStatus"
    class="status ready"
  >
    Enter authorized device key.
  </div>

</div>



<!-- =========================
     PAGE 2
========================= -->

<div id="scannerPage">

  <div id="scannerTitle">
    SENHS GATE SCANNER
  </div>


  <div
    id="status"
    class="status ready"
  >
    READY — SCAN QR CODE
  </div>


  <div id="reader"></div>


  <div id="countdown"></div>

</div>



<script>


/* =========================
   APPS SCRIPT URL
========================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


/* =========================
   VARIABLES
========================= */

let scanner = null;

let authorizedDeviceKey = "";

let deviceAuthorized = false;

let processing = false;

let countdownTimer = null;


/* =========================
   ELEMENTS
========================= */

const loginPage =
document.getElementById("loginPage");

const scannerPage =
document.getElementById("scannerPage");

const deviceKey =
document.getElementById("deviceKey");

const showKey =
document.getElementById("showKey");

const startBtn =
document.getElementById("startBtn");

const loginStatus =
document.getElementById("loginStatus");

const statusBox =
document.getElementById("status");

const countdown =
document.getElementById("countdown");


/* =========================
   SHOW / HIDE CODE
========================= */

showKey.addEventListener(
  "click",
  function() {

    if (deviceKey.type === "password") {

      deviceKey.type = "text";

      showKey.textContent = "🙈";

    } else {

      deviceKey.type = "password";

      showKey.textContent = "👁️";

    }

  }
);


/* =========================
   STATUS
========================= */

function setLoginStatus(
  message,
  className
) {

  loginStatus.innerHTML = message;

  loginStatus.className =
    "status " + className;

}


function setStatus(
  message,
  className
) {

  statusBox.innerHTML = message;

  statusBox.className =
    "status " + className;

}


/* =========================
   SOUND
========================= */

function acceptedSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 880;

    gain.gain.setValueAtTime(
      0.25,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.4
    );

    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.4
    );

  } catch (error) {}

}


/* =========================
   VIBRATION
========================= */

function deviceFeedback() {

  acceptedSound();

  if (navigator.vibrate) {

    navigator.vibrate([
      150,
      80,
      150
    ]);

  }

}


/* =========================
   START SCANNER
========================= */

startBtn.addEventListener(
  "click",
  async function() {

    const key =
      deviceKey.value.trim();


    if (!key) {

      setLoginStatus(
        "ENTER DEVICE KEY FIRST.",
        "denied"
      );

      return;

    }


    startBtn.disabled = true;


    setLoginStatus(
      "CHECKING DEVICE...",
      "processing"
    );


    try {

      const checkUrl =
        APPS_SCRIPT_URL +
        "?device=" +
        encodeURIComponent(key) +
        "&format=json";


      const response =
        await fetch(checkUrl);


      const result =
        await response.json();


      if (!result.success) {

        setLoginStatus(
          "❌ ACCESS DENIED",
          "denied"
        );

        startBtn.disabled = false;

        return;

      }


      /* AUTHORIZED */

      authorizedDeviceKey = key;

      deviceAuthorized = true;


      /*
        Clear the code.
      */

      deviceKey.value = "";


      /*
        Completely hide Page 1.
      */

      loginPage.style.display =
        "none";


      /*
        Show scanner page.
      */

      scannerPage.style.display =
        "block";


      setStatus(
        "STARTING CAMERA...",
        "processing"
      );


      /*
        Start camera.
      */

      scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          false
        );


      scanner.render(
        onScanSuccess,
        onScanFailure
      );


    } catch (error) {

      setLoginStatus(
        "❌ CONNECTION ERROR",
        "denied"
      );

      startBtn.disabled = false;

    }

  }
);


/* =========================
   QR SUCCESS
========================= */

async function onScanSuccess(
  decodedText
) {


  /*
    Ignore scan when
    not authorized.
  */

  if (!deviceAuthorized) return;


  /*
    Ignore scans during
    10-second display.
  */

  if (processing) return;


  processing = true;


  setStatus(
    "PROCESSING...",
    "processing"
  );


  let lrn = "";


  try {

    const url =
      new URL(decodedText);

    lrn =
      url.searchParams.get("lrn");

  } catch (error) {

    setStatus(
      "❌ INVALID QR CODE",
      "denied"
    );

    startCooldown();

    return;

  }


  if (!lrn) {

    setStatus(
      "❌ LRN NOT FOUND",
      "denied"
    );

    startCooldown();

    return;

  }


  /*
    Send scan to Apps Script.
  */

  const requestUrl =
    APPS_SCRIPT_URL +
    "?lrn=" +
    encodeURIComponent(lrn) +
    "&device=" +
    encodeURIComponent(
      authorizedDeviceKey
    ) +
    "&format=json";


  try {

    const response =
      await fetch(requestUrl);


    const result =
      await response.json();


    /*
      ERROR FROM SERVER
    */

    if (!result.success) {

      setStatus(
        "❌ ERROR<br>" +
        (
          result.message ||
          "Scan failed."
        ),
        "denied"
      );

      startCooldown();

      return;

    }


    /*
      SUCCESS
    */

    deviceFeedback();


    setStatus(

      "<div style='font-size:28px;'>" +
      result.name +
      "</div>" +

      "<div style='font-size:21px;margin-top:8px;'>" +
      result.section +
      "</div>" +

      "<div style='font-size:30px;margin-top:15px;'>" +
      result.event +
      "</div>" +

      "<div style='font-size:20px;margin-top:8px;'>" +
      result.time +
      "</div>" +

      "<div style='font-size:24px;margin-top:15px;'>" +
      "✅ RECORDED" +
      "</div>",

      "accepted"

    );


    /*
      Show result for 10 seconds.
    */

    startCooldown();


  } catch (error) {

    /*
      Don't show misleading
      NO INTERNET CONNECTION.
    */

    setStatus(
      "⚠️ SCAN SENT<br>Please wait...",
      "processing"
    );

    startCooldown();

  }

}


/* =========================
   10 SECOND WAIT
========================= */

function startCooldown() {


  let seconds = 10;


  countdown.innerHTML =
    "WAIT " +
    seconds +
    " SECONDS";


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

  }


  countdownTimer =
    setInterval(
      function() {


        seconds--;


        if (seconds > 0) {

          countdown.innerHTML =
            "WAIT " +
            seconds +
            " SECONDS";

        } else {


          clearInterval(
            countdownTimer
          );


          countdown.innerHTML =
            "";


          processing = false;


          setStatus(
            "READY — SCAN QR CODE",
            "ready"
          );


        }

      },
      1000
    );

}


/* =========================
   SCAN FAILURE
========================= */

function onScanFailure(error) {

  // Normal habang naghahanap ng QR.

}

</script>

</body>
</html>
