<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SENHS Gate Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 15px;
  background: white;
}

h2 {
  margin: 10px 0 15px;
}

#loginArea {
  max-width: 450px;
  margin: auto;
}

.keyBox {
  position: relative;
  width: 100%;
  margin-bottom: 10px;
}

#deviceKey {
  width: 100%;
  padding: 14px 50px 14px 14px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

#showKey {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 42px;
  height: 42px;
  border: none;
  background: transparent;
  font-size: 21px;
  cursor: pointer;
}

#startBtn {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#startBtn:disabled {
  opacity: 0.6;
}

.status {
  margin: 15px auto;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  border-radius: 10px;
  max-width: 450px;
}

.ready {
  background: #eeeeee;
  color: #222;
}

.processing {
  background: #fff3cd;
  color: #664d03;
}

.accepted {
  background: #d4edda;
  color: #155724;
}

.denied {
  background: #f8d7da;
  color: #721c24;
}

#scannerArea {
  display: none;
}

#scannerTitle {
  font-size: 24px;
  font-weight: bold;
  margin: 10px 0 15px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: auto;
}

#countdown {
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

</style>
</head>

<body>

<!-- DEVICE LOGIN -->

<div id="loginArea">

  <h2>SENHS GATE SCANNER</h2>

  <div class="keyBox">

    <input
      id="deviceKey"
      type="password"
      placeholder="Enter Gate Device Key"
      autocomplete="off"
    >

    <button
      id="showKey"
      type="button"
      aria-label="Show device key"
    >
      👁️
    </button>

  </div>

  <button
    id="startBtn"
    type="button"
  >
    START SCANNER
  </button>

  <div
    id="loginStatus"
    class="status ready"
  >
    Enter authorized device key.
  </div>

</div>


<!-- SCANNER -->

<div id="scannerArea">

  <div id="scannerTitle">
    SENHS GATE SCANNER
  </div>

  <div
    id="status"
    class="status ready"
  >
    READY — I-SCAN ANG QR CODE
  </div>

  <div id="reader"></div>

  <div id="countdown"></div>

</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


let scanner = null;
let processing = false;
let deviceAuthorized = false;
let authorizedDeviceKey = "";
let cooldownTimer = null;


/* ELEMENTS */

const deviceKey =
document.getElementById("deviceKey");

const showKey =
document.getElementById("showKey");

const startBtn =
document.getElementById("startBtn");

const loginArea =
document.getElementById("loginArea");

const scannerArea =
document.getElementById("scannerArea");

const loginStatus =
document.getElementById("loginStatus");

const statusBox =
document.getElementById("status");

const countdown =
document.getElementById("countdown");


/* SHOW / HIDE KEY */

showKey.addEventListener(
"click",
function() {

  if (deviceKey.type === "password") {

    deviceKey.type = "text";
    showKey.textContent = "🙈";

  } else {

    deviceKey.type = "password";
    showKey.textContent = "👁️";

  }

});


/* LOGIN STATUS */

function setLoginStatus(message, className) {

  loginStatus.innerHTML = message;
  loginStatus.className =
    "status " + className;

}


/* SCANNER STATUS */

function setStatus(message, className) {

  statusBox.innerHTML = message;
  statusBox.className =
    "status " + className;

}


/* ACCEPTED SOUND */

function acceptedSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 880;

    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.4
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.4
    );

  } catch (error) {

    // Ignore sound error

  }

}


/* VIBRATION */

function deviceFeedback() {

  acceptedSound();

  if (navigator.vibrate) {

    navigator.vibrate([
      150,
      80,
      150
    ]);

  }

}


/* START SCANNER */

startBtn.addEventListener(
"click",
async function() {

  const key =
    deviceKey.value.trim();


  if (!key) {

    setLoginStatus(
      "ENTER DEVICE KEY FIRST.",
      "denied"
    );

    return;

  }


  startBtn.disabled = true;


  setLoginStatus(
    "CHECKING DEVICE...",
    "processing"
  );


  try {

    const checkUrl =
      APPS_SCRIPT_URL +
      "?device=" +
      encodeURIComponent(key) +
      "&format=json";


    const response =
      await fetch(checkUrl);


    const result =
      await response.json();


    if (!result.success) {

      setLoginStatus(
        "❌ ACCESS DENIED<br>Unauthorized device",
        "denied"
      );

      startBtn.disabled = false;

      return;

    }


    /* AUTHORIZED DEVICE */

    authorizedDeviceKey = key;

    deviceAuthorized = true;


    /*
      Burahin ang key sa input.
      Hindi na ito makikita sa screen.
    */

    deviceKey.value = "";


    /*
      Itago ang login screen.
    */

    loginArea.style.display = "none";

    scannerArea.style.display = "block";


    setStatus(
      "STARTING CAMERA...",
      "processing"
    );


    /*
      Start QR scanner.
    */

    scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );


  } catch (error) {

    setLoginStatus(
      "❌ CONNECTION ERROR<br>Check internet connection.",
      "denied"
    );

    startBtn.disabled = false;

  }

});


/* QR SCAN SUCCESS */

async function onScanSuccess(decodedText) {


  if (!deviceAuthorized) return;

  if (processing) return;


  processing = true;


  setStatus(
    "PROCESSING...<br>Please wait.",
    "processing"
  );


  let lrn = "";


  try {

    const url =
      new URL(decodedText);

    lrn =
      url.searchParams.get("lrn");

  } catch (error) {

    setStatus(
      "❌ INVALID QR CODE",
      "denied"
    );

    startCooldown();

    return;

  }


  if (!lrn) {

    setStatus(
      "❌ LRN NOT FOUND",
      "denied"
    );

    startCooldown();

    return;

  }


  /*
    Send LRN + authorized device key
    to Apps Script.
  */

  const requestUrl =
    APPS_SCRIPT_URL +
    "?lrn=" +
    encodeURIComponent(lrn) +
    "&device=" +
    encodeURIComponent(authorizedDeviceKey) +
    "&format=json";


  try {

    const response =
      await fetch(requestUrl);


    const result =
      await response.json();


    /*
      SERVER ERROR
    */

    if (!result.success) {

      setStatus(
        "❌ ERROR<br>" +
        (result.message || "Scan failed."),
        "denied"
      );

      startCooldown();

      return;

    }


    /*
      SUCCESS
    */

    deviceFeedback();


    setStatus(

      "✅ " +
      result.event +

      "<br><br>" +

      "<strong>" +
      result.name +
      "</strong>" +

      "<br>" +

      result.section +

      "<br><br>" +

      "TIME: " +
      result.time +

      "<br>" +

      "TRANSACTION #" +
      result.transaction +

      "<br><br>" +

      "✅ RECORDED",

      "accepted"

    );


    /*
      Show result for 10 seconds.
    */

    startCooldown();


  } catch (error) {

    /*
      Important:
      Hindi agad sasabihin na
      NO INTERNET CONNECTION.

      Posibleng na-record na ng Apps Script
      kahit hindi bumalik nang maayos ang response.
    */

    setStatus(

      "⚠️ SCAN SENT<br>" +
      "Please wait...",

      "processing"

    );


    startCooldown();

  }

}


/* 10 SECOND COOLDOWN */

function startCooldown() {


  let seconds = 10;


  countdown.innerHTML =
    "NEXT SCAN IN " +
    seconds +
    " SECONDS";


  if (cooldownTimer) {

    clearInterval(cooldownTimer);

  }


  cooldownTimer =
    setInterval(
      function() {


        seconds--;


        if (seconds > 0) {

          countdown.innerHTML =
            "NEXT SCAN IN " +
            seconds +
            " SECONDS";

        } else {

          clearInterval(
            cooldownTimer
          );

          countdown.innerHTML = "";

          processing = false;

          setStatus(
            "READY — I-SCAN ANG QR CODE",
            "ready"
          );

        }

      },
      1000
    );

}


/* NORMAL QR SCANNING */

function onScanFailure(error) {

  // Normal habang naghahanap ng QR.

}

</script>

</body>
</html>
