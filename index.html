<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAN ESTEBAN NATIONAL HIGH SCHOOL - GATE SCANNER</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,.😎 0 45px, transparent 46px),
    radial-gradient(circle at 90% 20%, rgba(255,255,255,.55) 0 70px, transparent 71px),
    linear-gradient(135deg, #dff4ff 0%, #eefcf8 48%, #dcefff 100%);
  color: #123f63;
  overflow-x: hidden;
}

/* SCHOOL-THEMED DECORATIONS */
body::before {
  content: "";
  position: fixed;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: rgba(35, 130, 170, .08);
  top: -80px;
  left: -70px;
  z-index: -1;
}

body::after {
  content: "";
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(32, 150, 125, .08);
  bottom: -120px;
  right: -100px;
  z-index: -1;
}

/* LOGIN */
#loginPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.loginCard {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,.94);
  border-radius: 28px;
  padding: 38px 28px;
  text-align: center;
  box-shadow: 0 18px 45px rgba(18,63,99,.18);
  border: 1px solid rgba(255,255,255,.9);
}

#loginTitle {
  margin: 0 0 30px;
  line-height: 1.05;
}

#loginTitle span,
#loginTitle strong {
  display: block;
}

#loginTitle span {
  font-size: clamp(24px, 6vw, 38px);
  font-weight: 900;
  letter-spacing: .8px;
}

#loginTitle strong {
  margin-top: 7px;
  font-size: clamp(32px, 8vw, 48px);
  color: #197b91;
  letter-spacing: 1px;
}

.inputLabel {
  display: block;
  text-align: left;
  font-weight: 800;
  margin-bottom: 8px;
  color: #31566d;
}

.passwordBox {
  position: relative;
  width: 100%;
}

#deviceKey {
  width: 100%;
  height: 52px;
  padding: 0 52px 0 16px;
  border: 2px solid #b8d8e5;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}

#deviceKey:focus {
  border-color: #197b91;
  box-shadow: 0 0 0 4px rgba(25,123,145,.12);
}

#togglePassword {
  position: absolute;
  right: 6px;
  top: 5px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font-size: 21px;
  cursor: pointer;
}

#startButton {
  width: 100%;
  min-height: 54px;
  margin-top: 18px;
  border: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, #12618a, #199a8b);
  color: white;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: .5px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(18,97,138,.25);
}

#startButton:active {
  transform: scale(.98);
}

#loginMessage {
  margin-top: 15px;
  min-height: 22px;
  font-weight: 700;
}

/* SCANNER PAGE */
#scannerPage {
  display: none;
  min-height: 100vh;
  padding: 20px 16px 35px;
}

.scannerShell {
  width: 100%;
  max-width: 980px;
  margin: auto;
  position: relative;
}

/* Decorative school frame */
.scannerShell::before,
.scannerShell::after {
  content: "";
  position: absolute;
  border: 3px solid rgba(25,123,145,.12);
  pointer-events: none;
}

.scannerShell::before {
  width: 90px;
  height: 90px;
  top: -8px;
  left: -8px;
  border-right: 0;
  border-bottom: 0;
  border-radius: 25px 0 0 0;
}

.scannerShell::after {
  width: 90px;
  height: 90px;
  bottom: -8px;
  right: -8px;
  border-left: 0;
  border-top: 0;
  border-radius: 0 0 25px 0;
}

#scannerTitle {
  margin: 0 auto 18px;
  text-align: center;
  line-height: 1.03;
  color: #123f63;
  position: relative;
  z-index: 2;
}

#scannerTitle span,
#scannerTitle strong {
  display: block;
}

#scannerTitle span {
  font-size: clamp(25px, 5vw, 42px);
  font-weight: 900;
  letter-spacing: 1px;
}

#scannerTitle strong {
  margin-top: 5px;
  font-size: clamp(34px, 6vw, 52px);
  color: #197b91;
  letter-spacing: 1px;
}

/* Decorative school line */
.schoolLine {
  width: min(480px, 75%);
  height: 5px;
  margin: 0 auto 20px;
  border-radius: 20px;
  background: linear-gradient(90deg, #12618a, #199a8b, #12618a);
}

/* CAMERA CARD */
.cameraCard {
  position: relative;
  width: 100%;
  margin: auto;
  padding: 12px;
  border-radius: 26px;
  background:
    linear-gradient(145deg, rgba(18,97,138,.15), rgba(25,154,139,.12)),
    rgba(255,255,255,.88);
  border: 3px solid rgba(18,97,138,.16);
  box-shadow: 0 20px 50px rgba(18,63,99,.20);
}

.cameraInner {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: #07151d;
}

/* html5 QR container */
#reader {
  width: 100%;
}

/* Make camera larger */
#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
  object-fit: cover;
}

/* Hide library text/buttons that are unnecessary */
#reader__dashboard_section_csr button {
  border-radius: 10px !important;
  border: 0 !important;
  padding: 10px 15px !important;
  font-weight: 700 !important;
}

#reader__dashboard_section_csr span {
  font-size: 14px !important;
}

/* RESULT OVERLAY */
#resultOverlay {
  display: none;
  position: absolute;
  left: 14px;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 50;

  padding: 24px 16px;
  border-radius: 22px;

  color: white;
  text-align: center;

  background:
    linear-gradient(
      145deg,
      rgba(18,82,126,.98),
      rgba(25,139,145,.98)
    );

  border: 2px solid rgba(255,255,255,.75);
  box-shadow:
    0 15px 40px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.2);

  backdrop-filter: blur(6px);
}

.resultCheck {
  width: 58px;
  height: 58px;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: rgba(255,255,255,.18);
  border: 2px solid rgba(255,255,255,.65);

  font-size: 31px;
  font-weight: 900;
}

#studentName {
  font-size: clamp(24px, 5vw, 38px);
  line-height: 1.1;
  font-weight: 900;
  margin: 5px 0 8px;
  word-break: break-word;
}

#studentSection {
  font-size: clamp(17px, 3vw, 23px);
  font-weight: 700;
  margin-bottom: 15px;
  opacity: .95;
}

#eventText {
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 900;
  letter-spacing: 1px;
  margin: 5px 0;
}

#timeText {
  font-size: clamp(17px, 3vw, 23px);
  font-weight: 700;
  margin-top: 7px;
}

.recorded {
  display: inline-block;
  margin-top: 14px;
  padding: 8px 18px;
  border-radius: 30px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.55);
  font-weight: 900;
  letter-spacing: 1px;
}

/* READY MESSAGE */
#readyMessage {
  text-align: center;
  margin-top: 16px;
  padding: 13px 15px;

  border-radius: 16px;
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(18,97,138,.12);

  color: #12618a;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: .8px;

  box-shadow: 0 8px 20px rgba(18,63,99,.08);
}

/* PHONE */
@media (max-width: 767px) {
  #scannerPage {
    padding: 16px 10px 25px;
  }

  .cameraCard {
    padding: 7px;
    border-radius: 20px;
  }

  .cameraInner {
    border-radius: 14px;
  }

  #resultOverlay {
    left: 8px;
    right: 8px;
    padding: 18px 10px;
    border-radius: 18px;
  }

  .resultCheck {
    width: 48px;
    height: 48px;
    font-size: 25px;
  }
}

/* LAPTOP */
@media (min-width: 768px) {
  #scannerPage {
    padding-top: 25px;
  }

  .cameraCard {
    max-width: 800px;
  }

  #reader {
    min-height: 500px;
  }

  #reader video {
    min-height: 500px;
    object-fit: cover;
  }

  #resultOverlay {
    max-width: 760px;
    margin: auto;
  }
}

/* LARGE DESKTOP */
@media (min-width: 1100px) {
  .cameraCard {
    max-width: 900px;
  }

  #reader {
    min-height: 570px;
  }

  #reader video {
    min-height: 570px;
  }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<section id="loginPage">

  <div class="loginCard">

    <h1 id="loginTitle">
      <span>SAN ESTEBAN NATIONAL HIGH SCHOOL</span>
      <strong>GATE SCANNER</strong>
    </h1>

    <label class="inputLabel" for="deviceKey">
      Enter Gate Device Code
    </label>

    <div class="passwordBox">
      <input
        id="deviceKey"
        type="password"
        autocomplete="off"
        placeholder="Enter authorized device code"
      >

      <button
        id="togglePassword"
        type="button"
        aria-label="Show or hide device code"
      >
        👁️
      </button>
    </div>

    <button id="startButton" type="button">
      START SCANNER
    </button>

    <div id="loginMessage"></div>

  </div>

</section>


<!-- SCANNER PAGE -->
<section id="scannerPage">

  <div class="scannerShell">

    <h1 id="scannerTitle">
      <span>SAN ESTEBAN NATIONAL HIGH SCHOOL</span>
      <strong>GATE SCANNER</strong>
    </h1>

    <div class="schoolLine"></div>

    <div class="cameraCard">

      <div class="cameraInner">

        <div id="reader"></div>

        <!-- STUDENT RESULT OVERLAY -->
        <div id="resultOverlay">

          <div class="resultCheck">✓</div>

          <div id="studentName">
            Student Name
          </div>

          <div id="studentSection">
            Grade / Section
          </div>

          <div id="eventText">
            TIME IN
          </div>

          <div id="timeText">
            00:00:00 AM
          </div>

          <div class="recorded">
            RECORDED
          </div>

        </div>

      </div>

    </div>

    <div id="readyMessage">
      READY — SCAN QR CODE
    </div>

  </div>

</section>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


let deviceKey = "";
let scanner = null;
let scanningLocked = false;


/* ELEMENTS */
const loginPage =
  document.getElementById("loginPage");

const scannerPage =
  document.getElementById("scannerPage");

const deviceInput =
  document.getElementById("deviceKey");

const togglePassword =
  document.getElementById("togglePassword");

const startButton =
  document.getElementById("startButton");

const loginMessage =
  document.getElementById("loginMessage");

const resultOverlay =
  document.getElementById("resultOverlay");

const studentName =
  document.getElementById("studentName");

const studentSection =
  document.getElementById("studentSection");

const eventText =
  document.getElementById("eventText");

const timeText =
  document.getElementById("timeText");

const readyMessage =
  document.getElementById("readyMessage");


/* SHOW / HIDE PASSWORD */
togglePassword.addEventListener("click", function() {

  if (deviceInput.type === "password") {

    deviceInput.type = "text";
    togglePassword.textContent = "🙈";

  } else {

    deviceInput.type = "password";
    togglePassword.textContent = "👁️";

  }

});


/* ENTER KEY */
deviceInput.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    startButton.click();
  }

});


/* DEVICE AUTHENTICATION */
startButton.addEventListener("click", async function() {

  const key =
    deviceInput.value.trim();

  if (!key) {

    loginMessage.textContent =
      "Please enter the device code.";

    loginMessage.style.color = "#b42318";

    return;
  }

  loginMessage.textContent =
    "Checking device...";

  loginMessage.style.color =
    "#12618a";

  try {

    const response = await fetch(
      API_URL +
      "?device=" +
      encodeURIComponent(key) +
      "&format=json",
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const data =
      await response.json();

    if (!data.success) {

      loginMessage.textContent =
        "ACCESS DENIED — Unauthorized device.";

      loginMessage.style.color =
        "#b42318";

      return;
    }

    deviceKey = key;

    loginPage.style.display = "none";
    scannerPage.style.display = "block";

    startCamera();

  } catch (error) {

    loginMessage.textContent =
      "Unable to connect. Please check your internet.";

    loginMessage.style.color =
      "#b42318";

  }

});


/* START CAMERA */
function startCamera() {

  if (scanner) {
    return;
  }

  scanner =
    new Html5Qrcode("reader");

  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      let size =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        ) * 0.78;

      if (window.innerWidth >= 768) {

        size =
          Math.min(size, 450);

      } else {

        size =
          Math.min(size, 330);

      }

      size =
        Math.max(size, 240);

      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.333334

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  ).catch(function(error) {

    readyMessage.textContent =
      "CAMERA ERROR — PLEASE ALLOW CAMERA ACCESS";

    readyMessage.style.color =
      "#b42318";

    console.error(error);

  });

}


/* QR SCAN */
async function onScanSuccess(decodedText) {

  if (scanningLocked) {
    return;
  }

  scanningLocked = true;

  /* GET LRN FROM QR */
  let lrn = "";

  try {

    const url =
      new URL(decodedText);

    lrn =
      url.searchParams.get("lrn") || "";

  } catch (error) {

    /* If QR itself is just the LRN */
    lrn =
      String(decodedText).trim();

  }


  if (!lrn) {

    scanningLocked = false;

    return;
  }


  readyMessage.textContent =
    "PROCESSING...";

  readyMessage.style.color =
    "#12618a";


  try {

    /*
      IMPORTANT:
      Device key is sent to Apps Script.
      Apps Script decides whether recording
      is allowed.
    */

    const response =
      await fetch(

        API_URL +
        "?lrn=" +
        encodeURIComponent(lrn) +

        "&device=" +
        encodeURIComponent(deviceKey) +

        "&format=json",

        {
          method: "GET",
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      readyMessage.textContent =
        data.message ||
        "SCAN FAILED";

      readyMessage.style.color =
        "#b42318";

      scanningLocked = false;

      return;
    }


    /* DISPLAY RESULT */
    studentName.textContent =
      data.name || "Student";

    studentSection.textContent =
      data.section || "";

    eventText.textContent =
      data.event || "";

    timeText.textContent =
      data.time || "";


    resultOverlay.style.display =
      "block";


    readyMessage.textContent =
      "SCAN RECORDED";

    readyMessage.style.color =
      "#16734a";


    /* SOUND */
    playBeep();


    /* VIBRATION */
    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [150, 80, 150]
      );

    }


    /*
      RESULT STAYS FOR 5 SECONDS.
      NO OTHER SCAN IS ACCEPTED.
    */
    setTimeout(function() {

      resultOverlay.style.display =
        "none";

      readyMessage.textContent =
        "READY — SCAN QR CODE";

      readyMessage.style.color =
        "#12618a";

      scanningLocked = false;

    }, 5000);


  } catch (error) {

    /*
      If the server recorded the scan but
      the browser cannot read the response,
      don't falsely say "No internet".
    */

    readyMessage.textContent =
      "SCAN SENT — PLEASE WAIT...";

    readyMessage.style.color =
      "#12618a";


    setTimeout(function() {

      readyMessage.textContent =
        "READY — SCAN QR CODE";

      readyMessage.style.color =
        "#12618a";

      scanningLocked = false;

    }, 5000);

  }

}


/* QR FAILURE HANDLER */
function onScanFailure(error) {
  /* Ignore normal QR scanning failures */
}


/* BEEP SOUND */
function playBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      880;

    gain.gain.value =
      0.18;

    oscillator.connect(gain);
    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    setTimeout(function() {

      oscillator.stop();

      audioContext.close();

    }, 180);

  } catch (error) {

    console.log(
      "Audio not available."
    );

  }

}

</script>

</body>
</html>
