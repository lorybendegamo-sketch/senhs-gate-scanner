<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SENHS Gate Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #ffffff;
}

h2 {
  margin: 10px 0 20px;
}


/* =========================
   LOGIN PAGE
========================= */

#loginPage {
  max-width: 450px;
  margin: auto;
}

.keyBox {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

#deviceKey {
  width: 100%;
  padding: 15px 50px 15px 15px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

#showKey {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  font-size: 21px;
  cursor: pointer;
}

#startBtn {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

#startBtn:disabled {
  opacity: 0.6;
}


/* =========================
   STATUS
========================= */

.status {
  max-width: 450px;
  margin: 15px auto;
  padding: 15px;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
}

.ready {
  background: #eeeeee;
  color: #222;
}

.processing {
  background: #fff3cd;
  color: #664d03;
}

.accepted {
  background: #d4edda;
  color: #155724;
}

.denied {
  background: #f8d7da;
  color: #721c24;
}


/* =========================
   SCANNER PAGE
========================= */

#scannerPage {
  display: none;
}

#scannerTitle {
  font-size: 25px;
  font-weight: bold;
  margin: 10px 0 15px;
}


/* =========================
   CAMERA
========================= */

#cameraContainer {
  position: relative;
  width: 100%;
  max-width: 450px;
  margin: auto;
  overflow: hidden;
  border-radius: 12px;
}

#reader {
  width: 100%;
}


/* =========================
   RESULT OVERLAY
========================= */

#resultOverlay {

  display: none;

  position: absolute;

  left: 10px;
  right: 10px;
  top: 50%;

  transform: translateY(-50%);

  z-index: 20;

  padding: 18px 12px;

  border-radius: 15px;

  background: rgba(0, 0, 0, 0.82);

  color: white;

  text-align: center;

  box-shadow: 0 4px 20px rgba(0,0,0,0.35);

}


/* NAME */

#resultName {
  font-size: 27px;
  font-weight: bold;
  line-height: 1.2;
}


/* SECTION */

#resultSection {
  font-size: 20px;
  margin-top: 7px;
}


/* EVENT */

#resultEvent {
  font-size: 31px;
  font-weight: bold;
  margin-top: 14px;
}


/* TIME */

#resultTime {
  font-size: 21px;
  margin-top: 6px;
}


/* RECORDED */

#resultRecorded {
  font-size: 25px;
  font-weight: bold;
  margin-top: 13px;
}


/* COUNTDOWN */

#countdown {
  margin-top: 10px;
  font-size: 17px;
  font-weight: bold;
}


/* ==================================================
   LAPTOP / LARGE SCREEN
================================================== */

@media (min-width: 768px) {

  #scannerTitle {
    font-size: 30px;
    margin-bottom: 20px;
  }


  #cameraContainer {
    max-width: 800px;
  }


  #resultOverlay {
    left: 30px;
    right: 30px;
    padding: 28px 20px;
    border-radius: 18px;
  }


  #resultName {
    font-size: 38px;
  }


  #resultSection {
    font-size: 27px;
    margin-top: 10px;
  }


  #resultEvent {
    font-size: 42px;
    margin-top: 18px;
  }


  #resultTime {
    font-size: 29px;
    margin-top: 8px;
  }


  #resultRecorded {
    font-size: 32px;
    margin-top: 18px;
  }


  #countdown {
    font-size: 20px;
  }

}


/* ==================================================
   VERY LARGE LAPTOP / DESKTOP
================================================== */

@media (min-width: 1100px) {

  #cameraContainer {
    max-width: 900px;
  }

}

</style>

</head>


<body>


<!-- ==================================================
     PAGE 1 — DEVICE LOGIN
================================================== -->

<div id="loginPage">

  <h2>SENHS GATE SCANNER</h2>


  <div class="keyBox">

    <input
      id="deviceKey"
      type="password"
      placeholder="Enter Gate Device Key"
      autocomplete="off"
    >


    <button
      id="showKey"
      type="button"
    >
      👁️
    </button>

  </div>


  <button
    id="startBtn"
    type="button"
  >
    START SCANNER
  </button>


  <div
    id="loginStatus"
    class="status ready"
  >
    Enter authorized device key.
  </div>

</div>



<!-- ==================================================
     PAGE 2 — SCANNER
================================================== -->

<div id="scannerPage">

  <div id="scannerTitle">
    SENHS GATE SCANNER
  </div>


  <div
    id="status"
    class="status ready"
  >
    READY — SCAN QR CODE
  </div>


  <!-- CAMERA + RESULT OVERLAY -->

  <div id="cameraContainer">

    <div id="reader"></div>


    <div id="resultOverlay">

      <div id="resultName"></div>

      <div id="resultSection"></div>

      <div id="resultEvent"></div>

      <div id="resultTime"></div>

      <div id="resultRecorded">
        ✅ RECORDED
      </div>

    </div>

  </div>


  <div id="countdown"></div>

</div>



<script>


/* ==================================================
   APPS SCRIPT URL
================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


/* ==================================================
   VARIABLES
================================================== */

let scanner = null;

let authorizedDeviceKey = "";

let deviceAuthorized = false;

let processing = false;

let countdownTimer = null;


/* ==================================================
   ELEMENTS
================================================== */

const loginPage =
document.getElementById("loginPage");

const scannerPage =
document.getElementById("scannerPage");

const deviceKey =
document.getElementById("deviceKey");

const showKey =
document.getElementById("showKey");

const startBtn =
document.getElementById("startBtn");

const loginStatus =
document.getElementById("loginStatus");

const statusBox =
document.getElementById("status");

const countdown =
document.getElementById("countdown");

const resultOverlay =
document.getElementById("resultOverlay");

const resultName =
document.getElementById("resultName");

const resultSection =
document.getElementById("resultSection");

const resultEvent =
document.getElementById("resultEvent");

const resultTime =
document.getElementById("resultTime");


/* ==================================================
   SHOW / HIDE DEVICE KEY
================================================== */

showKey.addEventListener(
  "click",
  function() {

    if (deviceKey.type === "password") {

      deviceKey.type = "text";

      showKey.textContent = "🙈";

    } else {

      deviceKey.type = "password";

      showKey.textContent = "👁️";

    }

  }
);


/* ==================================================
   LOGIN STATUS
================================================== */

function setLoginStatus(
  message,
  className
) {

  loginStatus.innerHTML = message;

  loginStatus.className =
    "status " + className;

}


/* ==================================================
   MAIN STATUS
================================================== */

function setStatus(
  message,
  className
) {

  statusBox.innerHTML = message;

  statusBox.className =
    "status " + className;

}


/* ==================================================
   SOUND
================================================== */

function acceptedSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type = "sine";

    oscillator.frequency.value = 880;


    gain.gain.setValueAtTime(
      0.25,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.4
    );


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.4
    );

  } catch (error) {}

}


/* ==================================================
   VIBRATION
================================================== */

function deviceFeedback() {

  acceptedSound();


  if (navigator.vibrate) {

    navigator.vibrate([
      150,
      80,
      150
    ]);

  }

}


/* ==================================================
   START SCANNER
================================================== */

startBtn.addEventListener(
  "click",
  async function() {


    const key =
      deviceKey.value.trim();


    if (!key) {

      setLoginStatus(
        "ENTER DEVICE KEY FIRST.",
        "denied"
      );

      return;

    }


    startBtn.disabled = true;


    setLoginStatus(
      "CHECKING DEVICE...",
      "processing"
    );


    try {


      const checkUrl =
        APPS_SCRIPT_URL +
        "?device=" +
        encodeURIComponent(key) +
        "&format=json";


      const response =
        await fetch(checkUrl);


      const result =
        await response.json();


      if (!result.success) {

        setLoginStatus(
          "❌ ACCESS DENIED",
          "denied"
        );


        startBtn.disabled = false;

        return;

      }


      /* AUTHORIZED */

      authorizedDeviceKey = key;

      deviceAuthorized = true;


      /* CLEAR DEVICE KEY */

      deviceKey.value = "";


      /* HIDE LOGIN */

      loginPage.style.display =
        "none";


      /* SHOW SCANNER */

      scannerPage.style.display =
        "block";


      setStatus(
        "STARTING CAMERA...",
        "processing"
      );


      /* START CAMERA */

      scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },
          false
        );


      scanner.render(
        onScanSuccess,
        onScanFailure
      );


    } catch (error) {


      setLoginStatus(
        "❌ CONNECTION ERROR",
        "denied"
      );


      startBtn.disabled = false;

    }

  }
);


/* ==================================================
   QR SUCCESS
================================================== */

async function onScanSuccess(
  decodedText
) {


  if (!deviceAuthorized) return;


  if (processing) return;


  processing = true;


  /* HIDE READY MESSAGE */

  statusBox.style.display =
    "none";


  let lrn = "";


  try {


    const url =
      new URL(decodedText);


    lrn =
      url.searchParams.get("lrn");


  } catch (error) {


    showError(
      "❌ INVALID QR CODE"
    );


    startCooldown();

    return;

  }


  if (!lrn) {


    showError(
      "❌ LRN NOT FOUND"
    );


    startCooldown();

    return;

  }


  /* ==================================================
     SEND SCAN
  ================================================== */

  const requestUrl =
    APPS_SCRIPT_URL +
    "?lrn=" +
    encodeURIComponent(lrn) +
    "&device=" +
    encodeURIComponent(
      authorizedDeviceKey
    ) +
    "&format=json";


  try {


    const response =
      await fetch(requestUrl);


    const result =
      await response.json();


    /* ERROR */

    if (!result.success) {


      showError(
        "❌ " +
        (
          result.message ||
          "SCAN FAILED"
        )
      );


      startCooldown();

      return;

    }


    /* ==================================================
       SUCCESS
    ================================================== */

    deviceFeedback();


    /* STUDENT NAME */

    resultName.textContent =
      result.name || "";


    /* SECTION */

    resultSection.textContent =
      result.section || "";


    /* TIME IN / OUT */

    resultEvent.textContent =
      result.event || "";


    /* EXACT TIME */

    resultTime.textContent =
      result.time || "";


    /* SHOW OVERLAY */

    resultOverlay.style.display =
      "block";


    /* 5 SECOND DISPLAY */

    startCooldown();


  } catch (error) {


    /*
      Request may have reached Apps Script
      even if the browser cannot read the response.
    */

    resultName.textContent =
      "SCAN SENT";


    resultSection.textContent =
      "Please wait...";


    resultEvent.textContent =
      "";


    resultTime.textContent =
      "";


    resultOverlay.style.display =
      "block";


    startCooldown();

  }

}


/* ==================================================
   SHOW ERROR
================================================== */

function showError(
  message
) {

  statusBox.style.display =
    "block";


  setStatus(
    message,
    "denied"
  );

}


/* ==================================================
   5 SECOND COOLDOWN
================================================== */

function startCooldown() {


  let seconds = 5;


  countdown.innerHTML =
    "WAIT " +
    seconds +
    " SECONDS";


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

  }


  countdownTimer =
    setInterval(
      function() {


        seconds--;


        if (seconds > 0) {


          countdown.innerHTML =
            "WAIT " +
            seconds +
            " SECONDS";


        } else {


          clearInterval(
            countdownTimer
          );


          countdown.innerHTML =
            "";


          /* HIDE RESULT */

          resultOverlay.style.display =
            "none";


          /* SHOW READY */

          statusBox.style.display =
            "block";


          processing = false;


          setStatus(
            "READY — SCAN QR CODE",
            "ready"
          );

        }

      },
      1000
    );

}


/* ==================================================
   QR SCAN FAILURE
================================================== */

function onScanFailure(error) {

  /* Normal habang naghahanap ng QR */

}

</script>

</body>

</html>
