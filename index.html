<html lang="en">

  <title>SENHS Gate Scanner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f7fb;
      color: #123;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      position: relative;
    }

    /* =========================================
       PAGE 1
       ========================================= */

    #devicePage {
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
      overflow: hidden;
    }

    .device-watermark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 170px;
      font-weight: 900;
      color: rgba(0, 70, 140, 0.045);
      pointer-events: none;
      white-space: nowrap;
      z-index: 0;
    }

    .device-content {
      position: relative;
      z-index: 1;
    }

    .school-name {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: #124b7c;
    }

    .gate-title {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 800;
      color: #123;
    }

    .subtitle {
      margin-top: 8px;
      color: #667;
      font-size: 15px;
    }

    .device-label {
      display: block;
      margin-top: 35px;
      margin-bottom: 8px;
      text-align: left;
      font-weight: bold;
      color: #345;
    }

    /* =========================================
       DEVICE CODE
       ========================================= */

    .device-code-wrapper {
      position: relative;
      width: 100%;
      margin: 0 auto;
    }

    #deviceCode {
      width: 100%;
      padding: 17px;
      padding-right: 60px;
      font-size: 18px;
      border: 2px solid #ccd8e5;
      border-radius: 14px;
      outline: none;
      text-align: center;
      letter-spacing: 1px;
    }

    #deviceCode:focus {
      border-color: #1677c8;
    }

    #toggleDeviceCode {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #222;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      z-index: 10;
    }

    #toggleDeviceCode:hover {
      background: rgba(0,0,0,0.06);
    }

    #toggleDeviceCode:active {
      transform: translateY(-50%) scale(0.92);
    }

    #continueBtn {
      width: 100%;
      margin-top: 18px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #1267a5;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    #continueBtn:active {
      transform: scale(0.98);
    }

    #deviceMessage {
      min-height: 25px;
      margin-top: 15px;
      font-weight: bold;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }
