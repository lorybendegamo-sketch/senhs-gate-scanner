<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SENHS Gate Scanner</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<script>
/* =========================================================
   SENHS QR ATTENDANCE
   FRONTEND SESSION + SCANNER
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";


/* =========================================================
   DEVICE SESSION
   ========================================================= */

const CLIENT_ID =
  (window.crypto &&
   typeof window.crypto.randomUUID === "function")
    ? window.crypto.randomUUID()
    : "client-" +
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2, 12);

const CLIENT_PLATFORM =
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    ? "mobile"
    : "laptop";

let deviceKey = "";
let heartbeatTimer = null;
let sessionReleased = false;


/* =========================================================
   SCANNER VARIABLES
   ========================================================= */

let html5QrCode = null;
let cameras = [];
let currentCameraIndex = 0;
let scannerRunning = false;
let processing = false;
let attendanceTimer = null;


/* =========================================================
   SESSION PARAMETERS
   ========================================================= */

function getSessionParams() {

  return (
    "&device=" +
    encodeURIComponent(deviceKey) +

    "&client=" +
    encodeURIComponent(CLIENT_ID) +

    "&platform=" +
    encodeURIComponent(CLIENT_PLATFORM)
  );
}


/* =========================================================
   JSONP REQUEST
   ========================================================= */

function jsonpRequest(url) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "senhsCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    let finished = false;

    const timeout = setTimeout(function() {

      if (finished) return;

      finished = true;

      cleanup();

      reject(new Error("Unable to connect to server."));

    }, 12000);


    function cleanup() {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }
    }


    window[callbackName] = function(data) {

      if (finished) return;

      finished = true;

      cleanup();

      resolve(data);
    };


    script.onerror = function() {

      if (finished) return;

      finished = true;

      cleanup();

      reject(new Error("Unable to connect to server."));
    };


    let separator = "?";

    if (url.indexOf("?") !== -1) {
      separator = "&";
    }


    script.src =
      url +
      separator +
      "callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();

    script.async = true;

    document.body.appendChild(script);

  });
}


/* =========================================================
   DEVICE CODE VERIFICATION
   ========================================================= */

async function verifyDevice() {

  const input = document.getElementById("deviceCode");

  const message = document.getElementById("deviceMessage");

  const key = input.value.trim();


  if (!key) {

    message.textContent = "Please enter your Device Code.";

    return;
  }


  message.textContent = "Connecting...";


  try {

    const requestUrl =
      APPS_SCRIPT_URL +
      "?device=" +
      encodeURIComponent(key) +

      "&client=" +
      encodeURIComponent(CLIENT_ID) +

      "&platform=" +
      encodeURIComponent(CLIENT_PLATFORM);


    const result =
      await jsonpRequest(requestUrl);


    if (
      result &&
      result.success &&
      result.authorized
    ) {

      deviceKey = key;

      sessionReleased = false;

      message.textContent = "";

      startHeartbeat();

      openScannerPage();

    } else {

      message.textContent =
        result && result.message
          ? result.message
          : "Device Code is not authorized.";

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      error.message || "Unable to connect to server.";

  }

}


/* =========================================================
   HEARTBEAT
   ========================================================= */

function startHeartbeat() {

  stopHeartbeat();


  heartbeatTimer = setInterval(
    async function() {

      if (!deviceKey || sessionReleased) {
        return;
      }


      try {

        const url =
          APPS_SCRIPT_URL +
          "?heartbeat=1" +
          getSessionParams();


        const result =
          await jsonpRequest(url);


        if (
          result &&
          result.success === false
        ) {

          console.warn(
            "Device session:",
            result.message || "Session expired."
          );

        }

      } catch (error) {

        console.warn(
          "Heartbeat failed:",
          error
        );

      }

    },
    20000
  );
}


function stopHeartbeat() {

  if (heartbeatTimer) {

    clearInterval(heartbeatTimer);

    heartbeatTimer = null;
  }
}


/* =========================================================
   RELEASE DEVICE SESSION
   ========================================================= */

function releaseSession() {

  if (
    !deviceKey ||
    sessionReleased
  ) {
    return;
  }


  sessionReleased = true;

  stopHeartbeat();


  const params =
    "release=1" +
    getSessionParams();


  /*
   * First try sendBeacon.
   * This allows the browser to release the slot
   * even when the page is closing/backing out.
   */

  try {

    if (
      navigator.sendBeacon
    ) {

      const blob =
        new Blob(
          [params],
          {
            type:
              "application/x-www-form-urlencoded"
          }
        );


      const sent =
        navigator.sendBeacon(
          APPS_SCRIPT_URL,
          blob
        );


      if (sent) {
        return;
      }
    }

  } catch (error) {

    console.warn(
      "sendBeacon failed:",
      error
    );

  }


  /*
   * Fallback GET request.
   */

  try {

    const img =
      new Image();

    img.src =
      APPS_SCRIPT_URL +
      "?" +
      params +
      "&_=" +
      Date.now();

  } catch (error) {

    console.warn(
      "Release fallback failed:",
      error
    );

  }
}


/* =========================================================
   RELEASE WHEN PAGE LEAVES
   ========================================================= */

window.addEventListener(
  "pagehide",
  function() {

    releaseSession();

  }
);


window.addEventListener(
  "beforeunload",
  function() {

    releaseSession();

  }
);


/* =========================================================
   OPEN SCANNER PAGE
   ========================================================= */

function openScannerPage() {

  const devicePage =
    document.getElementById("devicePage");

  const scannerPage =
    document.getElementById("scannerPage");


  if (devicePage) {
    devicePage.style.display = "none";
  }


  if (scannerPage) {
    scannerPage.style.display = "block";
  }


  startCamera();

  loadAttendanceSummary();


  if (attendanceTimer) {
    clearInterval(attendanceTimer);
  }


  attendanceTimer =
    setInterval(
      loadAttendanceSummary,
      5000
    );
}


/* =========================================================
   PM DISPLAY TIME
   12:05 PM ONWARD
   ========================================================= */

function isPMDisplayTime() {

  const now = new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  return currentMinutes >= 725;
}


/* =========================================================
   ATTENDANCE SUMMARY
   ========================================================= */

async function loadAttendanceSummary() {

  try {

    const result =
      await jsonpRequest(
        APPS_SCRIPT_URL +
        "?summary=today"
      );


    if (!result || !result.success) {
      return;
    }


    /*
     * The following functions are intentionally
     * called only if they already exist in your
     * original HTML.
     */

    if (
      typeof updateAttendanceSummary ===
      "function"
    ) {

      updateAttendanceSummary(
        result
      );

    }


    if (
      typeof renderAttendanceSummary ===
      "function"
    ) {

      renderAttendanceSummary(
        result
      );

    }


    /*
     * If your original code directly uses
     * specific summary elements, this block
     * will not interfere with them.
     */

    window.latestAttendanceSummary =
      result;


  } catch (error) {

    console.warn(
      "Attendance summary failed:",
      error
    );

  }
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

  const overlay =
    document.getElementById("scanOverlay");


  try {

    if (overlay) {

      overlay.textContent =
        "Requesting camera permission...";

    }


    /*
     * getCameras() is used only when the scanner
     * is initialized. Once permission is granted,
     * switching cameras uses the camera IDs.
     */

    cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || !cameras.length) {

      if (overlay) {

        overlay.textContent =
          "No camera found.";

      }

      return;
    }


    /*
     * Prefer the rear/environment camera.
     */

    const backIndex =
      cameras.findIndex(
        function(camera) {

          return /back|rear|environment/i.test(
            camera.label || ""
          );

        }
      );


    currentCameraIndex =
      backIndex >= 0
        ? backIndex
        : 0;


    html5QrCode =
      new Html5Qrcode("reader");


    await startSelectedCamera();

  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    if (overlay) {

      overlay.textContent =
        "Camera permission is required. Please allow camera access in Chrome.";

    }

  }
}


/* =========================================================
   START SELECTED CAMERA
   ========================================================= */

async function startSelectedCamera() {

  if (!html5QrCode || !cameras.length) {
    return;
  }


  const camera =
    cameras[currentCameraIndex];


  if (!camera) {
    return;
  }


  try {

    if (scannerRunning) {

      await html5QrCode.stop();

      scannerRunning = false;
    }


    await html5QrCode.start(

      camera.id,

      {

        fps: 15,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.80;


            return {
              width: size,
              height: size
            };

          },

        aspectRatio: 1.0

      },

      onQrDetected,

      function() {}

    );


    scannerRunning = true;


    const overlay =
      document.getElementById(
        "scanOverlay"
      );


    if (overlay) {
      overlay.textContent =
        "Ready to scan";
    }


  } catch (error) {

    console.error(
      "Camera start failed:",
      error
    );


    scannerRunning = false;


    const overlay =
      document.getElementById(
        "scanOverlay"
      );


    if (overlay) {

      overlay.textContent =
        "Unable to start camera.";

    }

  }
}


/* =========================================================
   QR DETECTED
   ========================================================= */

async function onQrDetected(decodedText) {

  if (processing) {
    return;
  }


  processing = true;


  try {

    /*
     * Pause scanner while processing
     * the transaction.
     */

    if (
      html5QrCode &&
      scannerRunning
    ) {

      try {
        html5QrCode.pause(
          true
        );
      } catch (e) {}

    }


    let lrn =
      String(decodedText || "").trim();


    /*
     * Direct LRN
     */

    if (
      lrn.indexOf("http://") === 0 ||
      lrn.indexOf("https://") === 0
    ) {

      try {

        const url =
          new URL(lrn);


        lrn =
          url.searchParams.get("lrn") ||
          url.searchParams.get("id") ||
          lrn;

      } catch (e) {

        console.warn(
          "QR URL parsing failed:",
          e
        );

      }

    }


    if (!lrn) {

      showResult({
        success: false,
        message: "Invalid QR Code."
      });


      return;
    }


    /*
     * IMPORTANT:
     * Send client + platform together with
     * the scan so the server knows which
     * active session is performing the scan.
     */

    const requestUrl =
      APPS_SCRIPT_URL +
      "?lrn=" +
      encodeURIComponent(lrn) +

      getSessionParams();


    const result =
      await jsonpRequest(
        requestUrl
      );


    showResult(
      result
    );


  } catch (error) {

    console.error(
      "Scan processing error:",
      error
    );


    showResult({

      success: false,

      message:
        error.message ||
        "Unable to process scan."

    });

  }

}


/* =========================================================
   SHOW SCAN RESULT
   ========================================================= */

function showResult(result) {

  /*
   * If your original HTML already contains
   * showResult(), this version uses the same
   * common result elements when available.
   */

  const nameElement =
    document.getElementById(
      "resultName"
    );

  const sectionElement =
    document.getElementById(
      "resultSection"
    );

  const eventElement =
    document.getElementById(
      "resultEvent"
    );


  if (
    result &&
    result.success
  ) {

    if (nameElement) {

      nameElement.textContent =
        result.name ||
        result.studentName ||
        "";

    }


    if (sectionElement) {

      sectionElement.textContent =
        result.section ||
        "";

    }


    if (eventElement) {

      let eventText =
        result.event ||
        result.message ||
        "";


      if (
        result.status === "LATE"
      ) {

        eventText =
          eventText +
          " LATE";

      }


      eventElement.textContent =
        eventText;

    }

  } else {

    if (nameElement) {

      nameElement.textContent =
        "SCAN ERROR";

    }


    if (sectionElement) {

      sectionElement.textContent =
        "";

    }


    if (eventElement) {

      eventElement.textContent =
        result &&
        result.message
          ? result.message
          : "Unable to process scan.";

    }

  }


  /*
   * Allow another scan after 3 seconds.
   */

  setTimeout(
    function() {

      resumeScanner();

    },
    3000
  );
}


/* =========================================================
   RESUME SCANNER
   ========================================================= */

async function resumeScanner() {

  processing = false;


  if (!html5QrCode) {
    return;
  }


  try {

    if (scannerRunning) {

      try {

        html5QrCode.resume();

      } catch (e) {}

      return;
    }


    await startSelectedCamera();

  } catch (error) {

    console.warn(
      "Unable to resume scanner:",
      error
    );

  }

}


/* =========================================================
   SWITCH FRONT / BACK CAMERA
   ========================================================= */

async function switchCamera() {

  if (!cameras || cameras.length < 2) {

    return;
  }


  const previousIndex =
    currentCameraIndex;


  try {

    if (scannerRunning) {

      await html5QrCode.stop();

      scannerRunning = false;
    }


    currentCameraIndex =
      (currentCameraIndex + 1) %
      cameras.length;


    await startSelectedCamera();

  } catch (error) {

    console.error(
      "Camera switch failed:",
      error
    );


    currentCameraIndex =
      previousIndex;


    try {

      await startSelectedCamera();

    } catch (e) {}

  }

}


/* =========================================================
   DEVICE CODE SHOW / HIDE
   ========================================================= */

function toggleDeviceCode() {

  const input =
    document.getElementById(
      "deviceCode"
    );


  const button =
    document.getElementById(
      "toggleDeviceCode"
    );


  if (!input) {
    return;
  }


  if (
    input.type === "password"
  ) {

    input.type = "text";


    if (button) {
      button.textContent = "Hide";
    }

  } else {

    input.type = "password";


    if (button) {
      button.textContent = "Show";
    }

  }

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const continueBtn =
      document.getElementById(
        "continueBtn"
      );


    if (continueBtn) {

      continueBtn.addEventListener(
        "click",
        verifyDevice
      );

    }


    const toggleBtn =
      document.getElementById(
        "toggleDeviceCode"
      );


    if (toggleBtn) {

      toggleBtn.addEventListener(
        "click",
        toggleDeviceCode
      );

    }


    const switchCameraBtn =
      document.getElementById(
        "switchCameraBtn"
      );


    if (switchCameraBtn) {

      switchCameraBtn.addEventListener(
        "click",
        switchCamera
      );

    }


    const deviceCode =
      document.getElementById(
        "deviceCode"
      );


    if (deviceCode) {

      deviceCode.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            verifyDevice();

          }

        }
      );

    }

  }
);


/* =========================================================
   PHILIPPINE STANDARD TIME
   ========================================================= */

function updatePSTClock() {

  const clock =
    document.getElementById(
      "pstClock"
    );


  if (!clock) {
    return;
  }


  try {

    const now =
      new Date();


    const formatted =
      new Intl.DateTimeFormat(
        "en-PH",
        {

          timeZone:
            "Asia/Manila",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            true

        }
      ).format(now);


    clock.textContent =
      "PST: " +
      formatted;

  } catch (error) {

    clock.textContent =
      "";

  }

}


setInterval(
  updatePSTClock,
  1000
);


updatePSTClock();


/* =========================================================
   SAFETY
   ========================================================= */

window.addEventListener(
  "error",
  function(event) {

    console.warn(
      "SENHS scanner error:",
      event.error || event.message
    );

  }
);

</script>

</body>
</html>
