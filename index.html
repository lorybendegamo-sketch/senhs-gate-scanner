<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENHS Gate Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      font-size: 17px;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }

    #status {
      margin: 20px 0;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>SENHS GATE SCANNER</h2>

<input
  id="deviceKey"
  type="password"
  placeholder="Enter Gate Device Key"


<br>

<button id="startBtn" type="button">
  START SCANNER
</button>

<div id="status">Enter authorized device key.</div>

<div id="reader"></div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyXwfLu_wjourRT3BwQDTwA-H9vIJfu5LvqbjjbG3jwv5JVb0mi_1SO5CRPq60S5KdaCg/exec";

let processing = false;
let scanner = null;

document.getElementById("startBtn").addEventListener("click", function () {

  const key = document.getElementById("deviceKey").value.trim();

  if (!key) {
    document.getElementById("status").innerText =
      "Enter device key first.";
    return;
  }

  document.getElementById("status").innerText =
    "Starting camera...";

  scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },
    false
  );

  scanner.render(onScanSuccess, onScanFailure);
});

function onScanSuccess(decodedText) {

  if (processing) return;

  processing = true;

  document.getElementById("status").innerText =
    "Processing...";

  let lrn = "";

  try {

    const url = new URL(decodedText);

    lrn = url.searchParams.get("lrn");

  } catch (e) {

    document.getElementById("status").innerText =
      "Invalid QR Code";

    processing = false;

    return;
  }

  if (!lrn) {

    document.getElementById("status").innerText =
      "LRN not found";

    processing = false;

    return;
  }

  const key =
    document.getElementById("deviceKey").value.trim();

  const requestUrl =
    APPS_SCRIPT_URL +
    "?lrn=" + encodeURIComponent(lrn) +
    "&device=" + encodeURIComponent(key);

  fetch(requestUrl)

    .then(response => response.text())

    .then(result => {

      document.getElementById("status").innerHTML =
        result;

      setTimeout(function () {

        processing = false;

        document.getElementById("status").innerText =
          "Ready to scan.";

      }, 3000);

    })

    .catch(error => {

      document.getElementById("status").innerText =
        "Connection error.";

      processing = false;

    });
}

function onScanFailure(error) {
  // Normal habang naghahanap ng QR.
}

</script>

</body>
</html>
